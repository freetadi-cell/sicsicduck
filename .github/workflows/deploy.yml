name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare pages content
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r assets _site/
          cp logo.jpg favicon.ico favicon.png fb-badge.jpg popup-duck.jpg _site/ 2>/dev/null || true
          mkdir -p _site/data
          cp data/rates.json data/rental_income.json data/dividend_stocks.json data/wulin_world.json _site/data/ 2>/dev/null || true
          cp -r posts _site/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
