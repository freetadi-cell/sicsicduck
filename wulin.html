<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>武林 · Wulin Project（Prototype）</title>
<style>
:root{
  --bg:#0d1117;--bg2:#141b24;--card:#1a222d;--card2:#212b38;
  --text:#e6e1d5;--muted:#9aa5b1;--gold:#d4af37;--gold2:#b8962e;
  --red:#c0392b;--green:#27ae60;--border:#2a3441;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:36px 0 24px;border-bottom:1px solid var(--border);margin-bottom:20px;position:relative}
header::before{content:"武";position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:120px;color:rgba(212,175,55,.05);font-weight:900;pointer-events:none}
h1{font-size:34px;letter-spacing:14px;color:var(--gold);text-indent:14px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:2px}
.worldbar{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:18px 0 26px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:14px}
.chip b{color:var(--gold);font-weight:600}
.chip a{color:var(--muted);font-size:12px;text-decoration:none;margin-left:6px}
.chip a:hover{color:var(--gold)}
h2{font-size:17px;color:var(--gold);margin:26px 0 12px;letter-spacing:3px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.events{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.events li{list-style:none;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px;color:var(--text)}
.events li:last-child{border-bottom:none}
.events .tag{color:var(--gold2);font-size:12px;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.npc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.npc:hover{border-color:var(--gold2);background:var(--card2);transform:translateY(-2px)}
.npc .nm{font-size:18px;font-weight:700;color:var(--text)}
.npc .tt{font-size:12px;color:var(--gold);margin:2px 0 8px}
.npc .loc{font-size:12px;color:var(--muted)}
.npc .mood{font-size:13px;margin-top:8px;color:var(--text)}
.npc .att{font-size:12px;color:var(--muted);margin-top:4px}
.affbar{height:5px;background:var(--bg2);border-radius:3px;margin-top:10px;overflow:hidden}
.affbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px;transition:width .4s}
.affnum{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}
/* modal */
.modal{display:none;position:fixed;inset:0;z-index:100}
.modal.open{display:block}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.mbox{position:relative;max-width:560px;margin:6vh auto;background:var(--bg2);border:1px solid var(--gold2);border-radius:12px;padding:24px;max-height:84vh;overflow-y:auto}
.mclose{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.mclose:hover{color:var(--gold)}
.mname{font-size:22px;font-weight:700}
.mtitle{color:var(--gold);font-size:13px;margin-bottom:10px}
.mmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
.mmeta b{color:var(--text);font-weight:500}
.dlg{background:var(--card);border-left:3px solid var(--gold2);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:14px}
.dlg.me{border-left:none;border-right:3px solid var(--gold);border-radius:8px 0 0 8px;background:var(--card2);color:var(--gold);text-align:left}
.dlg .who{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.dlg.me .who{color:var(--gold2)}
.dlg.new{animation:pop .4s}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1}}
@keyframes popr{from{opacity:0;transform:translateX(6px)}to{opacity:1}}
.dlg.new.me{animation:popr .4s}
.chatlabel{font-size:12px;color:var(--muted);letter-spacing:2px;margin:16px 0 6px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px;margin:6px 0;transition:.2s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--gold2);background:var(--card2)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .fx{float:right;font-size:12px;color:var(--muted)}
.opt .fx.up{color:var(--green)}
.opt .fx.down{color:var(--red)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;background:var(--card);border:1px solid var(--gold2);color:var(--gold);padding:10px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;transition:.2s}
.btn:hover:not(:disabled){background:var(--gold2);color:#111}
.btn:disabled{opacity:.4;cursor:not-allowed}
.affbig{display:flex;align-items:center;gap:10px;margin:12px 0}
.affbig .affbar{flex:1;margin:0;height:7px}
.affdelta{font-size:12px;font-weight:700;margin-left:6px}
.affdelta.up{color:var(--green)}
.affdelta.down{color:var(--red)}
.mfoot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
/* auth */
#auth{display:none;position:fixed;inset:0;z-index:150;background:var(--bg)}
#auth.open{display:block}
.acard{max-width:400px;margin:7vh auto 0;background:var(--bg2);border:1px solid var(--gold2);border-radius:12px;padding:28px}
.acard h3{text-align:center;font-size:24px;color:var(--gold);letter-spacing:6px;margin-bottom:4px}
.atabs{display:flex;gap:8px;margin:18px 0 14px}
.atab{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:9px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;font-family:inherit}
.atab.on{border-color:var(--gold2);color:var(--gold);background:var(--card2)}
.afld{margin:10px 0}
.afld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.afld input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;padding:10px 12px;font-family:inherit}
.afld input:focus{outline:none;border-color:var(--gold)}
.aerr{color:var(--red);font-size:13px;min-height:20px;margin:6px 0}
.abtn{width:100%;background:var(--card);border:1px solid var(--gold2);color:var(--gold);padding:12px;border-radius:8px;cursor:pointer;font-size:16px;letter-spacing:4px;font-family:inherit;transition:.2s}
.abtn:hover{background:var(--gold2);color:#111}
.ahint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
.ahint a{color:var(--gold2);cursor:pointer;text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold2);color:#111;padding:10px 22px;border-radius:24px;font-size:14px;opacity:0;transition:.3s;z-index:300;pointer-events:none}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;letter-spacing:1px}
@media(max-width:600px){h1{font-size:26px;letter-spacing:8px}.mbox{margin:4vh 12px}.acard{margin:4vh 12px 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>武 林</h1>
    <div class="sub">WULIN PROJECT · 神鵰世界 · PROTOTYPE v3</div>
  </header>

  <div class="worldbar">
    <div class="chip">🗓 <b id="worldTime">載入中…</b></div>
    <div class="chip">🧍 <b id="playerName">…</b> · 閱歷 <b id="playerXp">0</b> · <a href="#" onclick="logout();return false">登出</a></div>
    <div class="chip">👥 <b id="npcCount">–</b> 位江湖人</div>
  </div>

  <h2>江湖大事</h2>
  <div class="events" id="events">載入中…</div>

  <h2>江湖人物</h2>
  <div class="grid" id="npcGrid"></div>

  <footer>世界由 AI 推進 · 對話選項每日更換 · 帳號資料只儲存於本裝置瀏覽器</footer>
</div>

<!-- NPC 對話框 -->
<div class="modal" id="modal"><div class="mback" onclick="closeModal()"></div><div class="mbox" id="mbox"></div></div>

<!-- 登入 / 註冊 -->
<div id="auth">
  <div class="acard">
    <h3>武 林</h3>
    <div class="atabs">
      <button class="atab" id="tabLogin" onclick="authTab('login')">登 入</button>
      <button class="atab" id="tabReg" onclick="authTab('reg')">新玩家註冊</button>
    </div>
    <div id="authBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let world=null,worldDay=1;
const $=id=>document.getElementById(id);

/* ================= 帳號系統（本機 localStorage） =================
   wulin_accounts: { [名號]: { ph:密碼SHA-256, save:玩家進度 } }
   wulin_player:   目前登入玩家嘅進度（session）                  */
function accounts(){try{return JSON.parse(localStorage.getItem('wulin_accounts'))||{}}catch(e){return{}}}
function saveAccounts(a){localStorage.setItem('wulin_accounts',JSON.stringify(a))}

async function sha256(s){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wulin·'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=5381;for(const c of s)h=((h*33)^c.codePointAt(0))>>>0; // 非安全環境 fallback
  return 'f'+h.toString(16);
}

function player(){ // 已登入先有
  let p;try{p=JSON.parse(localStorage.getItem('wulin_player'))}catch(e){}
  if(p&&p.name&&accounts()[p.name])return p;
  return null;
}
function savePlayer(p){
  localStorage.setItem('wulin_player',JSON.stringify(p));
  const a=accounts();
  if(a[p.name]){a[p.name].save=p;saveAccounts(a)} // 同步返帳號存檔
}
function logout(){
  localStorage.removeItem('wulin_player');
  closeModal();
  toast('已登出江湖');
  authTab('login');
  $('auth').classList.add('open');
}

/* ---- 登入 / 註冊畫面 ---- */
let authMode='login';
function authTab(m){
  authMode=m;
  $('tabLogin').classList.toggle('on',m==='login');
  $('tabReg').classList.toggle('on',m==='reg');
  const names=Object.keys(accounts());
  const dl=names.length?`<datalist id="knownNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`:'';
  const old=JSON.parse(localStorage.getItem('wulin_player')||'null');
  if(m==='reg'){
    // 舊玩家（v2 時代）補設密碼：保留原有進度
    const migrating=old&&old.name&&!accounts()[old.name];
    $('authBody').innerHTML=`
      ${migrating?`<div class="mmeta" style="text-align:center">歡迎返嚟，<b style="color:var(--gold)">${esc(old.name)}</b>！為舊存檔設定密碼：</div>`:''}
      <div class="afld"><label>江湖稱號</label><input id="regName" maxlength="10" placeholder="你的名號" value="${migrating?esc(old.name):''}" ${migrating?'readonly style="opacity:.6"':''}></div>
      <div class="afld"><label>密碼（至少 4 個字元）</label><input id="regPass" type="password" maxlength="32" placeholder="••••••"></div>
      <div class="afld"><label>確認密碼</label><input id="regPass2" type="password" maxlength="32" placeholder="••••••"></div>
      ${migrating?'':`<div class="ahint" style="margin-top:2px;text-align:left">冇諗到？<a onclick="regRandom()">隨機改個名</a></div>`}
      <div class="aerr" id="authErr"></div>
      <button class="abtn" onclick="regGo()">踏 入 江 湖</button>
      <div class="ahint">⚠️ 帳號同密碼只儲存喺呢部裝置嘅瀏覽器，<br>清除瀏覽器資料會令存檔消失，密碼唔可以找回。</div>${dl}`;
    $('regName').focus();
  }else{
    $('authBody').innerHTML=`
      <div class="afld"><label>江湖稱號</label><input id="logName" maxlength="10" placeholder="你的名號" list="knownNames"></div>
      <div class="afld"><label>密碼</label><input id="logPass" type="password" maxlength="32" placeholder="••••••"></div>
      <div class="aerr" id="authErr"></div>
      <button class="abtn" onclick="loginGo()">登 入</button>
      ${names.length?'':`<div class="ahint">仲未係玩家？<a onclick="authTab('reg')">去註冊</a></div>`}${dl}`;
    $('logName').focus();
  }
}
const NAME_POOL=['清風劍客','月下客','鐵掌書生','江南浪子','無名小俠','白衣少年','狂歌客','孤鴻子'];
function regRandom(){const el=$('regName');if(el&&!el.readOnly)el.value=NAME_POOL[Math.floor(Math.random()*NAME_POOL.length)]}

function authErr(msg){const e=$('authErr');if(e)e.textContent=msg||''}

async function regGo(){
  const name=($('regName').value||'').trim().slice(0,10);
  const p1=$('regPass').value,p2=$('regPass2').value;
  if(!name){authErr('總要有個名號嘛');return}
  if(p1.length<4){authErr('密碼至少 4 個字元');return}
  if(p1!==p2){authErr('兩次密碼唔一致');return}
  const a=accounts();
  const old=JSON.parse(localStorage.getItem('wulin_player')||'null');
  const migrating=old&&old.name===name&&!a[name];
  if(a[name]){authErr('呢個名號已有人用，揀過另一個');return}
  const ph=await sha256(p1);
  const st=migrating?old:{name,xp:0,aff:{},spoke:{},gifts:{},opts:{},day:0};
  a[name]={ph,save:st};
  saveAccounts(a);
  localStorage.setItem('wulin_player',JSON.stringify(st));
  $('auth').classList.remove('open');
  toast(migrating?`存檔已加密保護 · 歡迎返嚟，${name}`:`「${name}」踏入江湖 🌻`);
  render();
}
async function loginGo(){
  const name=($('logName').value||'').trim().slice(0,10);
  const pw=$('logPass').value;
  const a=accounts();
  if(!a[name]){authErr('冇呢個名號——先註冊先入到江湖');return}
  const ph=await sha256(pw);
  if(ph!==a[name].ph){authErr('名號或密碼錯誤');return}
  localStorage.setItem('wulin_player',JSON.stringify(a[name].save));
  $('auth').classList.remove('open');
  authErr('');
  toast(`歡迎返嚟，${name}`);
  render();
}

/* ================= 遊戲邏輯 ================= */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function aff(key){ // 好感：玩家本地為準，冇先攞世界預設
  const p=player(),n=world.npcs.find(x=>x.key===key);
  if(p&&p.aff[key]!=null)return p.aff[key];
  return n?(n.affinity||0):0;
}
function setAff(key,v){
  const p=player();if(!p)return;
  p.aff[key]=Math.max(0,Math.min(100,Math.round(v)));
  savePlayer(p);
}

/* ---- 載入同渲染 ---- */
async function load(){
  try{
    const r=await fetch('data/wulin_world.json?t='+Date.now());
    world=await r.json();
  }catch(e){$('worldTime').textContent='載入失敗';return}
  worldDay=parseInt((String(world.meta.world_time).match(/第(\d+)日/)||[0,1])[1])||1;
  if(!player()){
    // 未登入：照樣渲染世界（背後模糊可見），彈登入畫面
    const old=JSON.parse(localStorage.getItem('wulin_player')||'null');
    authTab(old&&old.name&&!accounts()[old.name]?'reg':'login');
    $('auth').classList.add('open');
    renderGuest();
    return;
  }
  render();
}
function renderGuest(){
  $('worldTime').textContent=world.meta.world_time||'—';
  $('npcCount').textContent=world.npcs.length;
  $('playerName').textContent='—';$('playerXp').textContent='—';
  $('events').innerHTML=(world.events||[]).slice(-6).map(e=>
    `<li><span class="tag">第${e.day}日</span>${esc(e.text)}</li>`).join('');
  $('npcGrid').innerHTML=world.npcs.map(n=>`
    <div class="npc" style="opacity:.55">
      <div class="nm">${esc(n.name)}</div>
      <div class="tt">${esc(n.title||'')}</div>
      <div class="loc">📍 ${esc(n.location||'')}</div>
    </div>`).join('');
}
function render(){
  $('worldTime').textContent=world.meta.world_time||'—';
  $('npcCount').textContent=world.npcs.length;
  const p=player();if(!p){renderGuest();return}
  $('playerName').textContent=p.name;
  $('playerXp').textContent=p.xp;
  $('events').innerHTML=(world.events||[]).slice(-6).map(e=>
    `<li><span class="tag">第${e.day}日</span>${esc(e.text)}</li>`).join('');
  $('npcGrid').innerHTML=world.npcs.map(n=>{
    const a=aff(n.key);
    return `<div class="npc" onclick="openNpc('${n.key}')">
      <div class="nm">${esc(n.name)}</div>
      <div class="tt">${esc(n.title||'')}</div>
      <div class="loc">📍 ${esc(n.location||'')}</div>
      <div class="mood">心境：${esc(n.mood||'')}</div>
      <div class="att">${esc(n.attitude||'')}</div>
      <div class="affbar"><i style="width:${a}%"></i></div>
      <div class="affnum">好感 ${a}</div>
    </div>`}).join('');
}

/* ---- NPC 對話框 ---- */
function openNpc(key){
  const n=world.npcs.find(x=>x.key===key);if(!n)return;
  const p=player();if(!p){authTab('login');$('auth').classList.add('open');return}
  const rel=Object.entries(n.relations||{}).slice(0,4).map(([k,v])=>{
    const o=world.npcs.find(x=>x.key===k);
    return o?`${esc(o.name)} ${v}`:'';
  }).filter(Boolean).join(' · ');
  const a=aff(key);
  const opts=(n.chat_options||[]).map((o,i)=>{
    const used=p.opts[key+':'+i]===worldDay;
    const fx=o.affinity_delta>0?`<span class="fx up">♥+${o.affinity_delta}</span>`
            :o.affinity_delta<0?`<span class="fx down">♥${o.affinity_delta}</span>`:'';
    return `<button class="opt" id="opt_${key}_${i}" ${used?'disabled':''} onclick="say('${key}',${i})">${esc(o.say)}${used?' <span class="fx">✓ 講過</span>':fx}</button>`;
  }).join('');
  $('mbox').innerHTML=`
    <button class="mclose" onclick="closeModal()">✕</button>
    <div class="mname">${esc(n.name)}</div>
    <div class="mtitle">${esc(n.title||'')}</div>
    <div class="mmeta">📍 ${esc(n.location||'')}<br>心境：<b>${esc(n.mood||'')}</b><br>待人：<b>${esc(n.attitude||'')}</b></div>
    <div class="affbig"><div class="affbar"><i id="affBar" style="width:${a}%"></i></div><span style="color:var(--gold);font-size:13px">好感 <span id="affNum">${a}</span><span id="affDelta" class="affdelta"></span></span></div>
    <div id="dlgArea">${(n.dialogue||[]).map(d=>`<div class="dlg"><span class="who">${esc(n.name)}</span>${esc(d)}</div>`).join('')}</div>
    <div class="chatlabel">— 你開口講（每日一款）—</div>
    <div id="optArea">${opts||'<div class="mmeta">（佢暫時冇咩想聽……聽日再嚟）</div>'}</div>
    ${rel?`<div class="mmeta" style="margin-top:12px">交情：${rel}</div>`:''}
    <div class="acts">
      <button class="btn" id="btnGift" ${p.gifts[key]===worldDay?'disabled':''} onclick="act('${key}','gift')">🎁 贈禮</button>
      <button class="btn" id="btnSpar" ${p.spoke[key+'#spar']===worldDay?'disabled':''} onclick="act('${key}','spar')">⚔️ 切磋</button>
    </div>
    <div class="mfoot">講嘅嘢會即刻影響好感 · NPC 心境每日都唔同</div>`;
  $('modal').classList.add('open');
}
function closeModal(){$('modal').classList.remove('open')}

function pushDlg(text,me){
  const d=document.createElement('div');
  d.className='dlg new'+(me?' me':'');
  if(me)d.innerHTML=`<span class="who">${esc(player().name)}</span>${esc(text)}`;
  else d.textContent=text;
  $('dlgArea').appendChild(d);
  const box=$('mbox');box.scrollTop=box.scrollHeight;
}
function bumpAff(key,delta){
  if(!delta)return;
  const v=aff(key)+delta;setAff(key,v);
  const bar=$('affBar'),num=$('affNum'),dl=$('affDelta');
  if(bar)bar.style.width=v+'%';
  if(num)num.textContent=v;
  if(dl){
    dl.textContent=(delta>0?'+':'')+delta;
    dl.className='affdelta '+(delta>0?'up':'down');
    setTimeout(()=>{dl.textContent=''},2500);
  }
  const p=player();$('playerXp').textContent=p.xp;
}

/* ---- 玩家開口講 ---- */
function say(key,i){
  const n=world.npcs.find(x=>x.key===key);if(!n)return;
  const o=(n.chat_options||[])[i];if(!o)return;
  const p=player();
  if(p.opts[key+':'+i]===worldDay)return;
  p.opts[key+':'+i]=worldDay;
  savePlayer(p);
  const btn=$('opt_'+key+'_'+i);
  if(btn){btn.disabled=true;btn.innerHTML=esc(o.say)+' <span class="fx">✓ 講過</span>'}
  pushDlg(o.say,true);
  setTimeout(()=>{
    pushDlg(o.reply,false);
    bumpAff(key,o.affinity_delta||0);
    if(o.affinity_delta>0)toast('佢幾受落 · 好感 +'+o.affinity_delta);
    else if(o.affinity_delta<0)toast('講錯嘢喇… 好感 '+o.affinity_delta);
    if(p.spoke[key]!==worldDay){p.spoke[key]=worldDay;p.xp+=2;savePlayer(p);$('playerXp').textContent=p.xp}
  },400);
}

/* ---- 贈禮 / 切磋 ---- */
function act(key,type){
  const n=world.npcs.find(x=>x.key===key);
  const p=player();
  if(type==='gift'){
    if(p.gifts[key]===worldDay)return;
    p.gifts[key]=worldDay;
    const btn=$('btnGift');if(btn)btn.disabled=true;
    pushDlg('（你奉上一份禮物）',true);
    setTimeout(()=>{
      pushDlg('（'+esc(n.name)+'接過，神色微動）你有心。',false);
      bumpAff(key,4);toast('贈禮 · 好感 +4');
    },400);
  }else if(type==='spar'){
    if(p.spoke[key+'#spar']===worldDay)return;
    p.spoke[key+'#spar']=worldDay;
    const btn=$('btnSpar');if(btn)btn.disabled=true;
    const a=aff(key);
    const win=Math.random()<(0.35+a/200);
    p.xp+=win?5:3;savePlayer(p);
    pushDlg('（你抱拳：請指教！）',true);
    setTimeout(()=>{
      if(win){pushDlg('（過了三招，'+esc(n.name)+'收勢）有幾下散手！俾面你。',false);bumpAff(key,3);toast('切磋勝 · 閱歷 +5 · 好感 +3')}
      else{pushDlg('（三招之內被制住）後生人，基本功返去緊啲。',false);bumpAff(key,-1);toast('切磋敗 · 閱歷 +3 · 好感 -1')}
      $('playerXp').textContent=p.xp;
    },400);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal(); // auth 畫面唔會被 Esc 關掉
  if(e.key==='Enter'){
    if($('auth').classList.contains('open')){
      if(authMode==='reg'&&document.activeElement&&document.activeElement.id!=='regPass2'){$('regPass2').focus();return}
      authMode==='reg'?regGo():loginGo();
    }
  }
});
load();
</script>
