<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>武林 · Wulin Project（Prototype）</title>
<style>
:root{
  --bg:#0d1117;--bg2:#141b24;--card:#1a222d;--card2:#212b38;
  --text:#e6e1d5;--muted:#9aa5b1;--gold:#d4af37;--gold2:#b8962e;
  --red:#c0392b;--green:#27ae60;--border:#2a3441;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:36px 0 24px;border-bottom:1px solid var(--border);margin-bottom:20px;position:relative}
header::before{content:"武";position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:120px;color:rgba(212,175,55,.05);font-weight:900;pointer-events:none}
h1{font-size:34px;letter-spacing:14px;color:var(--gold);text-indent:14px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:2px}
.worldbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px}
.chip b{color:var(--gold);font-weight:600}
.chip a{color:var(--muted);font-size:12px;text-decoration:none;margin-left:6px}
.chip a:hover{color:var(--gold)}
.chip .align-bar{display:inline-block;width:50px;height:5px;background:var(--bg2);border-radius:3px;margin-left:4px;vertical-align:middle;overflow:hidden}
.chip .align-bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.chip .align-bar i.evil{background:var(--red)}
.chip .align-bar i.neutral{background:var(--muted)}
.chip .align-bar i.good{background:var(--green)}
h2{font-size:17px;color:var(--gold);margin:26px 0 12px;letter-spacing:3px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.region-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:18px}
.region-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.region-current{font-size:15px;color:var(--text)}
.region-current b{color:var(--gold)}
.region-desc{font-size:12px;color:var(--muted);margin-top:4px}
.region-travel{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.travel-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;transition:.2s}
.travel-btn:hover:not(:disabled){border-color:var(--gold2);color:var(--gold)}
.travel-btn:disabled{opacity:.4;cursor:not-allowed}
.travel-btn .days{color:var(--gold2);font-weight:600}
.cooling{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);color:var(--red);padding:8px 14px;border-radius:8px;font-size:13px;text-align:center;margin-top:10px}
.cooling b{color:var(--text)}
.events{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px}
.events li{list-style:none;padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px;color:var(--text)}
.events li:last-child{border-bottom:none}
.events .tag{color:var(--gold2);font-size:12px;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.npc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.npc:hover{border-color:var(--gold2);background:var(--card2);transform:translateY(-2px)}
.npc .nm{font-size:18px;font-weight:700;color:var(--text)}
.npc .tt{font-size:12px;color:var(--gold);margin:2px 0 8px}
.npc .loc{font-size:12px;color:var(--muted)}
.npc .mood{font-size:13px;margin-top:8px;color:var(--text)}
.npc .att{font-size:12px;color:var(--muted);margin-top:4px}
.npc .alabel{font-size:11px;margin-top:6px}
.npc .alabel.good{color:var(--green)}
.npc .alabel.neutral{color:var(--muted)}
.npc .alabel.evil{color:var(--red)}
.affbar{height:5px;background:var(--bg2);border-radius:3px;margin-top:10px;overflow:hidden}
.affbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px;transition:width .4s}
.affnum{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}
.modal{display:none;position:fixed;inset:0;z-index:100}
.modal.open{display:block}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.mbox{position:relative;max-width:560px;margin:6vh auto;background:var(--bg2);border:1px solid var(--gold2);border-radius:12px;padding:24px;max-height:84vh;overflow-y:auto}
.mclose{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.mclose:hover{color:var(--gold)}
.mname{font-size:22px;font-weight:700}
.mtitle{color:var(--gold);font-size:13px;margin-bottom:10px}
.mmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
.mmeta b{color:var(--text);font-weight:500}
.dlg{background:var(--card);border-left:3px solid var(--gold2);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:14px}
.dlg.me{border-left:none;border-right:3px solid var(--gold);border-radius:8px 0 0 8px;background:var(--card2);color:var(--gold);text-align:left}
.dlg .who{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.dlg.me .who{color:var(--gold2)}
.dlg.npcattack{border-left:3px solid var(--red);background:rgba(192,57,43,.12)}
.dlg.npcattack .who{color:var(--red)}
.dlg.new{animation:pop .4s}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1}}
@keyframes popr{from{opacity:0;transform:translateX(6px)}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dlg.new.me{animation:popr .4s}
.mbox.shake{animation:shake .4s}
.chatlabel{font-size:12px;color:var(--muted);letter-spacing:2px;margin:16px 0 6px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px;margin:6px 0;transition:.2s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--gold2);background:var(--card2)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .fx{float:right;font-size:12px;color:var(--muted)}
.opt .fx.up{color:var(--green)}
.opt .fx.down{color:var(--red)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;background:var(--card);border:1px solid var(--gold2);color:var(--gold);padding:10px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;transition:.2s}
.btn:hover:not(:disabled){background:var(--gold2);color:#111}
.btn:disabled{opacity:.4;cursor:not-allowed}
.affbig{display:flex;align-items:center;gap:10px;margin:12px 0}
.affbig .affbar{flex:1;margin:0;height:7px}
.affdelta{font-size:12px;font-weight:700;margin-left:6px}
.affdelta.up{color:var(--green)}
.affdelta.down{color:var(--red)}
.mfoot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
.difflabel{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin:0 0 8px}
.difflabel.friendly{background:rgba(39,174,96,.15);color:var(--green)}
.difflabel.neutral{background:rgba(154,165,177,.12);color:var(--muted)}
.difflabel.tension{background:rgba(192,57,43,.15);color:var(--red)}
.difflabel.locked{background:rgba(192,57,43,.25);color:var(--red);font-weight:700;letter-spacing:1px}
#auth{display:none;position:fixed;inset:0;z-index:150;background:var(--bg)}
#auth.open{display:block}
.acard{max-width:400px;margin:7vh auto 0;background:var(--bg2);border:1px solid var(--gold2);border-radius:12px;padding:28px}
.acard h3{text-align:center;font-size:24px;color:var(--gold);letter-spacing:6px;margin-bottom:4px}
.atabs{display:flex;gap:8px;margin:18px 0 14px}
.atab{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:9px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;font-family:inherit}
.atab.on{border-color:var(--gold2);color:var(--gold);background:var(--card2)}
.afld{margin:10px 0}
.afld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
.afld input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;padding:10px 12px;font-family:inherit}
.afld input:focus{outline:none;border-color:var(--gold)}
.aerr{color:var(--red);font-size:13px;min-height:20px;margin:6px 0}
.abtn{width:100%;background:var(--card);border:1px solid var(--gold2);color:var(--gold);padding:12px;border-radius:8px;cursor:pointer;font-size:16px;letter-spacing:4px;font-family:inherit;transition:.2s}
.abtn:hover{background:var(--gold2);color:#111}
.ahint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
.ahint a{color:var(--gold2);cursor:pointer;text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold2);color:#111;padding:10px 22px;border-radius:24px;font-size:14px;opacity:0;transition:.3s;z-index:300;pointer-events:none}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;letter-spacing:1px}
@media(max-width:600px){h1{font-size:26px;letter-spacing:8px}.mbox{margin:4vh 12px}.acard{margin:4vh 12px 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>武 林</h1>
    <div class="sub">WULIN PROJECT · 神鵰世界 · PROTOTYPE v5</div>
  </header>

  <div class="worldbar">
    <div class="chip">🗓 <b id="worldTime">載入中…</b></div>
    <div class="chip">🧍 <b id="playerName">…</b></div>
    <div class="chip">⚡ 閱歷 <b id="playerXp">0</b></div>
    <div class="chip" id="playerAlignChip" style="display:none">⚖️ <b id="playerAlignLabel">中立</b> <span class="align-bar"><i id="playerAlignBar"></i></span> <b id="playerAlignNum">500</b></div>
    <div class="chip">👥 <b id="npcCount">–</b> 位 · <b id="npcLocal">–</b> 同區</div>
    <div class="chip"><a href="#" onclick="logout();return false">登出</a></div>
  </div>

  <div class="region-panel" id="regionPanel" style="display:none"></div>

  <h2>江湖大事</h2>
  <div class="events" id="events">載入中…</div>

  <h2>江湖人物<span id="regionTag" style="font-size:12px;color:var(--muted);font-weight:normal;margin-left:12px"></span></h2>
  <div class="grid" id="npcGrid"></div>

  <footer>世界由 AI 推進 · 只有同區 NPC 才可以互動 · 本頁為未公開原型</footer>
</div>

<div class="modal" id="modal"><div class="mback" onclick="closeModal()"></div><div class="mbox" id="mbox"></div></div>

<div id="auth">
  <div class="acard">
    <h3>武 林</h3>
    <div class="atabs">
      <button class="atab" id="tabLogin" onclick="authTab('login')">登 入</button>
      <button class="atab" id="tabReg" onclick="authTab('reg')">新玩家註冊</button>
    </div>
    <div id="authBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let world=null,worldDay=1;
const $=id=>document.getElementById(id);

/* ================= 帳號系統（Supabase） ================= */
const SUPABASE_URL='https://swsdzpakaywkxxngatiw.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3c2R6cGFrYXl3a3h4bmdhdGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODU1NTcsImV4cCI6MjEwNDI2MTU1N30.WGbiqYuXMHeWNf1u4Ou9-YAQxBp2KTxDy0vZKr4CJEk';
let _cloudAccounts=null,_cloudSha=null;

async function cloudLoad(){
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/players?select=*`,{
      headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}
    });
    if(!r.ok)return false;
    const rows=await r.json();
    const accounts={};
    rows.forEach(row=>{accounts[row.name]={ph:row.ph,save:row.save}});
    _cloudAccounts=accounts;
    return true;
  }catch(e){console.log('[CLOUD] load error',e);return false}
}

async function cloudSave(accounts){
  try{
    // 先用 upsert 寫入每個玩家
    const entries=Object.entries(accounts);
    for(const [name,data] of entries){
      await fetch(`${SUPABASE_URL}/rest/v1/players`,{
        method:'POST',
        headers:{
          'apikey':SUPABASE_ANON,
          'Authorization':'Bearer '+SUPABASE_ANON,
          'Content-Type':'application/json',
          'Prefer':'resolution=merge-duplicates'
        },
        body:JSON.stringify({name,ph:data.ph,save:data.save})
      });
    }
    return true;
  }catch(e){console.log('[CLOUD] save error',e);return false}
}

function accounts(){
  if(_cloudAccounts)return _cloudAccounts;
  try{return JSON.parse(localStorage.getItem('wulin_accounts'))||{}}catch(e){return{}}
}
function saveAccounts(a){
  localStorage.setItem('wulin_accounts',JSON.stringify(a));
  return cloudSave(a).then(ok=>{console.log('[CLOUD] save result:',ok?'✅':'❌');return ok}).catch(e=>{console.error('[CLOUD] save error',e);return false});
}
async function sha256(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wulin·'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of s)h=((h*33)^c.codePointAt(0))>>>0;return 'f'+h.toString(16);
}
function player(){
  let p;try{p=JSON.parse(localStorage.getItem('wulin_player'))}catch(e){console.log('[WULIN] player() parse error',e)}
  const a=accounts();
  const ok=p&&p.name&&a[p.name];
  console.log('[WULIN] player() check:',{hasP:!!p,name:p?.name,hasAccount:!!a[p?.name],result:ok?'VALID':'NULL',accounts:Object.keys(a)});
  return ok?p:null;
}
function savePlayer(p){
  localStorage.setItem('wulin_player',JSON.stringify(p));
  const a=accounts();if(a[p.name]){a[p.name].save=p;saveAccounts(a)}
}
function logout(){localStorage.removeItem('wulin_player');closeModal();toast('已登出江湖');authTab('login');$('auth').classList.add('open')}
let authMode='login';
function authTab(m){
  authMode=m;$('tabLogin').classList.toggle('on',m==='login');$('tabReg').classList.toggle('on',m==='reg');
  const names=Object.keys(accounts());
  const dl=names.length?`<datalist id="knownNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`:'';
  const old=JSON.parse(localStorage.getItem('wulin_player')||'null');
  if(m==='reg'){
    const migrating=old&&old.name&&!accounts()[old.name];
    $('authBody').innerHTML=`
      ${migrating?`<div class="mmeta" style="text-align:center">歡迎返嚟，<b style="color:var(--gold)">${esc(old.name)}</b>！為舊存檔設定密碼：</div>`:''}
      <div class="afld"><label>江湖稱號</label><input id="regName" maxlength="10" placeholder="你的名號" value="${migrating?esc(old.name):''}" ${migrating?'readonly style="opacity:.6"':''}></div>
      <div class="afld"><label>密碼（至少 4 個字元）</label><input id="regPass" type="password" maxlength="32" placeholder="••••••"></div>
      <div class="afld"><label>確認密碼</label><input id="regPass2" type="password" maxlength="32" placeholder="••••••"></div>
      ${migrating?'':`<div class="ahint" style="margin-top:2px;text-align:left">想不到？<a onclick="regRandom()">隨機取個名</a></div>`}
      <div class="aerr" id="authErr"></div>
      <button class="abtn" onclick="regGo()">踏 入 江 湖</button>
      <div class="ahint">⚠️ 帳號和密碼會同步到雲端，跨裝置可用。</div>${dl}`;
    $('regName').focus();
  }else{
    $('authBody').innerHTML=`
      <div class="afld"><label>江湖稱號</label><input id="logName" maxlength="10" placeholder="你的名號" list="knownNames"></div>
      <div class="afld"><label>密碼</label><input id="logPass" type="password" maxlength="32" placeholder="••••••"></div>
      <div class="aerr" id="authErr"></div>
      <button class="abtn" onclick="loginGo()">登 入</button>
      ${names.length?'':`<div class="ahint">還不是玩家？<a onclick="authTab('reg')">去註冊</a></div>`}${dl}`;
    $('logName').focus();
  }
}
const NAME_POOL=['清風劍客','月下客','鐵掌書生','江南浪子','無名小俠','白衣少年','狂歌客','孤鴻子'];
function regRandom(){const el=$('regName');if(el&&!el.readOnly)el.value=NAME_POOL[Math.floor(Math.random()*NAME_POOL.length)]}
function authErr(msg){const e=$('authErr');if(e)e.textContent=msg||''}
async function regGo(){
  const name=($('regName').value||'').trim().slice(0,10),p1=$('regPass').value,p2=$('regPass2').value;
  if(!name){authErr('總要有一個名號');return}
  if(p1.length<4){authErr('密碼至少 4 個字元');return}
  if(p1!==p2){authErr('兩次密碼不一致');return}
  const a=accounts(),old=JSON.parse(localStorage.getItem('wulin_player')||'null');
  const migrating=old&&old.name===name&&!a[name];
  if(a[name]){authErr('這個名號已有人使用，請另選一個');return}
  const ph=await sha256(p1);
  const st=migrating?old:{name,xp:0,alignment:500,aff:{},spoke:{},gifts:{},opts:{},day:0,region:'襄陽城',cooldown:0};
  if(!st.alignment)st.alignment=500;if(!st.region)st.region='襄陽城';if(!st.cooldown)st.cooldown=0;
  a[name]={ph,save:st};
  const saved=await saveAccounts(a);
  if(!saved){authErr('雲端儲存失敗，請稍後再試');return}
  localStorage.setItem('wulin_player',JSON.stringify(st));
  $('auth').classList.remove('open');
  toast(migrating?`存檔已同步到雲端 · 歡迎返嚟，${name}`:`「${name}」踏入江湖 🌻`);render();
}
async function loginGo(){
  const name=($('logName').value||'').trim().slice(0,10),pw=$('logPass').value,a=accounts();
  if(!a[name]){authErr('沒有這個名號——需先註冊才能進入江湖');return}
  if(await sha256(pw)!==a[name].ph){authErr('名號或密碼錯誤');return}
  const save=a[name].save;if(!save.alignment)save.alignment=500;if(!save.region)save.region='襄陽城';if(!save.cooldown)save.cooldown=0;
  localStorage.setItem('wulin_player',JSON.stringify(save));
  $('auth').classList.remove('open');authErr('');toast(`歡迎返嚟，${name}`);render();
}

/* ================= 遊戲邏輯 ================= */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function playerAlign(){const p=player();return p?(p.alignment||500):500}
function alignLabel(a){
  if(a>=800)return '大義凜然';if(a>=650)return '行俠仗義';if(a>=550)return '正氣凜然';
  if(a>=450)return '亦正亦邪';if(a>=350)return '乖張無常';if(a>=200)return '心狠手辣';return '惡貫滿盈';
}
function alignLabelShort(a){if(a>=650)return '正派';if(a>=450)return '中立';return '邪惡'}
function alignCss(a){return a>=600?'good':a>=400?'neutral':'evil'}
function alignBarPct(a){return Math.round(a/10)}
function setPlayerAlign(delta){const p=player();if(!p)return;p.alignment=Math.max(0,Math.min(1000,Math.round((p.alignment||500)+delta)));savePlayer(p);renderPlayerBar()}
function renderPlayerBar(){
  const a=playerAlign(),bar=$('playerAlignBar'),lbl=$('playerAlignLabel'),num=$('playerAlignNum');
  if(bar){bar.style.width=alignBarPct(a)+'%';bar.className=alignCss(a)}
  if(lbl)lbl.textContent=alignLabel(a);if(num)num.textContent=a;
}
function alignDiff(pk,nk){return Math.abs(pk-nk)}

function aff(key){const p=player(),n=world.npcs.find(x=>x.key===key);if(p&&p.aff[key]!=null)return p.aff[key];return n?(n.affinity||0):0}
function setAff(key,v){const p=player();if(!p)return;p.aff[key]=Math.max(0,Math.min(100,Math.round(v)));savePlayer(p)}

let _pendingTravel=null;
function confirmTravel(dest,days){
  _pendingTravel={dest,days};
  $('modal').classList.add('open');
  $('mbox').innerHTML=`
    <button class="mclose" onclick="cancelTravel()">✕</button>
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:40px;margin-bottom:12px">🚶</div>
      <div class="mname">確認出發</div>
      <div class="mmeta" style="margin:14px 0">
        目的地：<b style="color:var(--gold);font-size:16px">${esc(dest)}</b><br>
        行程時間：<b>${days} 分鐘</b>（${days} 遊戲日）<br>
        <span style="color:var(--red);font-size:12px">冷卻期間無法與任何人互動</span>
      </div>
      <button class="abtn" onclick="confirmGo()">確認出發</button>
      <button class="abtn" style="margin-top:8px;border-color:var(--border);color:var(--muted)" onclick="cancelTravel()">留在原地</button>
    </div>`;
}
function confirmGo(){
  if(!_pendingTravel)return;
  const{dest,days}=_pendingTravel;_pendingTravel=null;
  $('modal').classList.remove('open');
  startTravel(dest,days);
}
function cancelTravel(){_pendingTravel=null;$('modal').classList.remove('open')}

function playerRegion(){const p=player();return p?(p.region||'襄陽城'):'襄陽城'}
function playerCooldown(){
  const p=player();if(!p||!p.travel)return null;
  const remaining=p.travel.until-Date.now();
  if(remaining<=0)return null;
  return{dest:p.travel.dest,remainingMs:remaining};
}
function getDistance(a,b){const d=world?.meta?.region_distances;return d?.[a]?.[b]??d?.[b]?.[a]??1}
function startTravel(dest,travelDays){
  const p=player();if(!p)return;
  const ms=travelDays*60000;
  p.travel={dest,until:Date.now()+ms};
  savePlayer(p);
  render();
  toast(`出發前往 ${dest}（${travelDays} 分鐘 / ${travelDays} 遊戲日後抵達）`);
}
function finishTravelIfDone(){
  const p=player();if(!p||!p.travel)return;
  if(Date.now()>=p.travel.until){
    const dest=p.travel.dest;
    p.region=dest;p.travel=null;
    savePlayer(p);
    toast(`🏃 你抵達 ${dest}，可以行動了！`);
    render();
  }
}

function renderRegionPanel(){
  const reg=$('regionPanel');
  const p=player();if(!p){reg.style.display='none';return}
  finishTravelIfDone();
  const cur=playerRegion(),cd=playerCooldown();
  const regions=world.meta.regions||{};
  const allR=Object.keys(regions);

  let html=`<div class="region-header">
    <div class="region-current">📍 你在 <b>${esc(cur)}</b>　<span style="font-size:12px;color:var(--muted)">${esc(regions[cur]||'')}</span></div>
  </div>`;

  if(cd){
    const fmtMs=cd.remainingMs;
    const mins=Math.floor(fmtMs/60000);
    const secs=Math.floor((fmtMs%60000)/1000);
    html+=`<div class="cooling">🚶 你正在趕路去 <b>${esc(cd.dest)}</b>…… 剩餘 <b>${mins}分${String(secs).padStart(2,'0')}秒</b></div>`;
  }else{
    html+=`<div class="region-travel">`;
    for(const r of allR){
      if(r===cur)continue;
      const days=getDistance(cur,r);
      const npcs=world.npcs.filter(n=>n.region===r);
      html+=`<button class="travel-btn" onclick="doTravel('${esc(r)}',${days})">${esc(r)} <span class="days">${days}分鐘</span>　<span style="font-size:11px;color:var(--muted)">${npcs.map(n=>n.name).join('、')||'（沒有人）'}</span></button>`;
    }
    html+=`</div>`;
  }
  reg.innerHTML=html;
  reg.style.display='block';
}
function doTravel(dest,days){
  const cd=playerCooldown();
  if(cd){toast('你還在趕路，不能再出發');return}
  confirmTravel(dest,days);
}

let travelTimer=null;
function startTravelTimer(){
  if(travelTimer)clearInterval(travelTimer);
  travelTimer=setInterval(()=>{
    finishTravelIfDone();
    renderRegionPanel();
  },1000);
}

let _wulinReady=false;
async function load(){
  try{const r=await fetch('data/wulin_world.json?t='+Date.now());world=await r.json()}
  catch(e){$('worldTime').textContent='載入失敗';return}
  worldDay=parseInt((String(world.meta.world_time).match(/第(\d+)日/)||[0,1])[1])||1;
  // 啟動時先載入雲端帳號，否則重新開頁面後只會睇到本機 localStorage
  const cloudReady=await cloudLoad();
  console.log('[CLOUD] initial load:',cloudReady?'✅':'⚠️ fallback to local data');
  if(!player()){authTab('login');$('auth').classList.add('open');renderGuest();return}
  _wulinReady=true;
  startTravelTimer();
  render();
}
function renderGuest(){
  $('worldTime').textContent=world.meta.world_time||'—';$('npcCount').textContent=world.npcs.length;$('npcLocal').textContent='—';
  $('playerName').textContent='—';$('playerXp').textContent='—';
  $('events').innerHTML=(world.events||[]).slice(-6).map(e=>
    `<li><span class="tag">第${e.day}日</span>${esc(e.text)}</li>`).join('');
  $('regionPanel').style.display='none';
  renderNpcs(null);
}
function render(){
  $('worldTime').textContent=world.meta.world_time||'—';$('npcCount').textContent=world.npcs.length;
  const p=player();console.log('[WULIN] render() player:',p?p.name:'NULL','region:',p?p.region:'?');
  if(!p){renderGuest();return}
  $('playerName').textContent=p.name;$('playerXp').textContent=p.xp;
  $('playerAlignChip').style.display='';renderPlayerBar();
  $('events').innerHTML=(world.events||[]).slice(-6).map(e=>
    `<li><span class="tag">第${e.day}日</span>${esc(e.text)}</li>`).join('');
  renderRegionPanel();
  renderNpcs(p);
}
function renderNpcs(p){
  const p2=p||player();
  if(!p2){renderNpcGrid(world.npcs);return}
  const cur=playerRegion(),cd=playerCooldown();
  const local=world.npcs.filter(n=>n.region===cur);
  $('npcLocal').textContent=local.length;
  $('regionTag').textContent=cd?`(冷卻中)`:`(在 ${esc(cur)})`;

  if(cd){
    $('npcGrid').innerHTML=`<div style="text-align:center;color:var(--muted);padding:30px;font-size:14px;grid-column:1/-1">🚶 你正在趕路，到達後才能與 NPC 互動</div>`;
    return;
  }
  renderNpcGrid(local);
}
function renderNpcGrid(npcs){
  const p=player(),pa=playerAlign();
  $('npcGrid').innerHTML=npcs.map(n=>{
    const a=aff(n.key),al=n.alignment||500,diff=alignDiff(pa,al);
    const ac=alignCss(al);
    return `<div class="npc" onclick="openNpc('${n.key}')">
      <div class="nm">${esc(n.name)}</div><div class="tt">${esc(n.title||'')}</div>
      <div class="alabel ${ac}">${alignLabelShort(al)} · ${al}</div>
      <div class="mood">心境：${esc(n.mood||'')}</div>
      <div class="att">${esc(n.attitude||'')}</div>
      <div class="affbar"><i style="width:${a}%"></i></div>
      <div class="affnum">好感 ${a}${diff>300?' · <span style="color:var(--red)">道不同</span>':''}</div>
    </div>`}).join('');
}

function openNpc(key){
  const n=world.npcs.find(x=>x.key===key);if(!n)return;
  const p=player();if(!p){authTab('login');$('auth').classList.add('open');return}
  const cd=playerCooldown();if(cd){toast('你還在趕路，無法互動');return}
  const cur=playerRegion();if(n.region!==cur){toast('你與他不在同一個地區');return}
  const pa=playerAlign(),na=n.alignment||500,diff=alignDiff(pa,na);
  const locked=diff>300&&diff<=500;
  const hostile=diff>500;
  const rel=Object.entries(n.relations||{}).slice(0,4).map(([k,v])=>{
    const o=world.npcs.find(x=>x.key===k);return o?`${esc(o.name)} ${v}`:'';
  }).filter(Boolean).join(' · ');
  const a=aff(key);
  let html=`
    <button class="mclose" onclick="closeModal()">✕</button>
    <div class="mname">${esc(n.name)}</div>
    <div class="mtitle">${esc(n.title||'')}</div>
    <div class="mmeta">📍 ${esc(n.location||'')} · ${esc(n.region||'')}<br>心境：<b>${esc(n.mood||'')}</b><br>待人：<b>${esc(n.attitude||'')}</b></div>
    <div class="affbig"><div class="affbar"><i id="affBar" style="width:${a}%"></i></div><span style="color:var(--gold);font-size:13px">好感 <span id="affNum">${a}</span><span id="affDelta" class="affdelta"></span></span></div>
    <div id="dlgArea">${(n.dialogue||[]).map(d=>`<div class="dlg"><span class="who">${esc(n.name)}</span>${esc(d)}</div>`).join('')}</div>`;
  if(diff<=100) html+=`<div class="difflabel friendly">道合 · 善惡差 ${diff}</div>`;
  else if(diff<=300) html+=`<div class="difflabel neutral">各行其道 · 善惡差 ${diff}</div>`;
  else if(diff<=500) html+=`<div class="difflabel tension">道不同不相為謀 · 善惡差 ${diff}</div>`;
  else html+=`<div class="difflabel locked">⛔ 善惡懸殊 · 善惡差 ${diff} — 無話可說</div>`;
  if(hostile){
    html+=`<div class="chatlabel" style="color:var(--red)">— 此人視你為敵，無法交流 —</div>`;
  }else if(locked){
    html+=`<div class="chatlabel" style="color:var(--red)">— 道不同不相為謀 —</div>
           <div class="mmeta" style="text-align:center">你與${esc(n.name)}善惡懸殊，無話可說。<br>你的善惡值：<b>${pa}</b>　他的善惡值：<b>${na}</b><br>差 ${diff}（需要 ≤300 才能交談）</div>`;
  }else{
    const opts=(n.chat_options||[]).map((o,i)=>{
      const used=p.opts[key+':'+i]===worldDay;
      let fxText='';
      if(o.affinity_delta>0)fxText+=`<span class="fx up">♥+${o.affinity_delta}</span>`;
      else if(o.affinity_delta<0)fxText+=`<span class="fx down">♥${o.affinity_delta}</span>`;
      if(o.alignment_delta>0)fxText+=`<span class="fx up">☯+${o.alignment_delta}</span>`;
      else if(o.alignment_delta<0)fxText+=`<span class="fx down">☯${o.alignment_delta}</span>`;
      return `<button class="opt" id="opt_${key}_${i}" ${used?'disabled':''} onclick="say('${key}',${i})">${esc(o.say)}${used?' <span class="fx">✓ 已說</span>':fxText}</button>`;
    }).join('');
    html+=`<div class="chatlabel">— 你開口說話（每天一種）—</div>
            <div id="optArea">${opts||'<div class="mmeta">（他暫時沒有什麼想說……明天再來）</div>'}</div>`;
  }
  if(rel)html+=`<div class="mmeta" style="margin-top:12px">交情：${rel}</div>`;
  html+=`<div class="acts">`;
  if(!hostile){
    html+=`<button class="btn" id="btnGift" ${p.gifts[key]===worldDay?'disabled':''} onclick="act('${key}','gift')">🎁 贈禮</button>`;
    html+=`<button class="btn" id="btnSpar" ${p.spoke[key+'#spar']===worldDay?'disabled':''} onclick="act('${key}','spar')">⚔️ 切磋</button>`;
  }else{
    html+=`<button class="btn" id="btnFlee" onclick="act('${key}','flee')">🏃 逃走</button>`;
  }
  html+=`</div>`;
  html+=`<div class="mfoot">善惡差 >300 無法對話 · >500 觸發攻擊 · 玩家善惡值 ${pa}（${alignLabel(pa)}）</div>`;
  $('mbox').innerHTML=html;
  $('modal').classList.add('open');
  if(hostile)setTimeout(()=>triggerAttack(key),600);
}
function closeModal(){$('modal').classList.remove('open')}

function pushDlg(text,me,cls,whoName){
  const d=document.createElement('div');
  d.className='dlg new'+(me?' me':'')+(cls?' '+cls:'');
  if(me)d.innerHTML=`<span class="who">${esc(player().name)}</span>${esc(text)}`;
  else{
    const wh=cls==='npcattack'?`<b style="color:var(--red)">⚔️ ${esc(whoName)}</b>`:(whoName?esc(whoName):'');
    d.innerHTML=`<span class="who">${wh}</span>${cls==='npcattack'?'<b style="color:var(--red)">'+esc(text)+'</b>':esc(text)}`;
  }
  $('dlgArea').appendChild(d);
  $('mbox').scrollTop=$('mbox').scrollHeight;
}
function bumpAff(key,delta){
  if(!delta)return;const v=aff(key)+delta;setAff(key,v);
  const bar=$('affBar'),num=$('affNum'),dl=$('affDelta');
  if(bar)bar.style.width=v+'%';if(num)num.textContent=v;
  if(dl){dl.textContent=(delta>0?'+':'')+delta;dl.className='affdelta '+(delta>0?'up':'down');setTimeout(()=>{dl.textContent=''},2500)}
}
function triggerAttack(key){
  const n=world.npcs.find(x=>x.key===key);if(!n)return;
  $('mbox').classList.add('shake');
  pushDlg(`${esc(n.name)}大喝一聲：「受死！」`,false,'npcattack',n.name);
  setTimeout(()=>{
    const p=player();
    const dmg=Math.max(1,Math.round(Math.random()*3+1));
    const xpLost=Math.min(p.xp,dmg*2);
    p.xp=Math.max(0,p.xp-xpLost);
    savePlayer(p);$('playerXp').textContent=p.xp;
    pushDlg(`你被${esc(n.name)}一掌擊退，跌坐地上，損失閱歷 ${xpLost}`,true);
    toast(`⚔️ 遭到${esc(n.name)}攻擊！閱歷 -${xpLost}`);
  },800);
}
function say(key,i){
  const n=world.npcs.find(x=>x.key===key);if(!n)return;
  const o=(n.chat_options||[])[i];if(!o)return;
  const p=player();
  if(p.opts[key+':'+i]===worldDay)return;
  p.opts[key+':'+i]=worldDay;savePlayer(p);
  const btn=$('opt_'+key+'_'+i);
  if(btn){btn.disabled=true;btn.innerHTML=esc(o.say)+' <span class="fx">✓ 已說</span>'}
  pushDlg(o.say,true);
  setTimeout(()=>{
    pushDlg(o.reply,false);
    bumpAff(key,o.affinity_delta||0);
    const ad=o.alignment_delta||0;
    if(ad)setPlayerAlign(ad);
    let msg='';
    if(o.affinity_delta>0)msg='他頗受用 · 好感 +'+o.affinity_delta;
    else if(o.affinity_delta<0)msg='說錯話了… 好感 '+o.affinity_delta;
    if(ad>0)msg+=msg?' · ☯ 善行 +'+ad:'☯ 善行 +'+ad;
    else if(ad<0)msg+=msg?' · ☯ '+ad:'☯ '+ad;
    if(msg)toast(msg);
    if(p.spoke[key]!==worldDay){p.spoke[key]=worldDay;p.xp+=2;savePlayer(p);$('playerXp').textContent=p.xp}
  },400);
}
function act(key,type){
  const n=world.npcs.find(x=>x.key===key);
  const p=player();
  if(type==='flee'){
    const flee=Math.random()>0.3;
    if(flee){pushDlg('（你轉身狂奔，幸虧甩掉了'+esc(n.name)+'）',true);toast('成功逃走！');setTimeout(closeModal,1000)}
    else{pushDlg('（你轉身想走，被'+esc(n.name)+'一把揪住）想走？沒那麼容易！',false,'npcattack',n.name);
      const xpLost=3;p.xp=Math.max(0,p.xp-xpLost);savePlayer(p);$('playerXp').textContent=p.xp;
      pushDlg(`被打了幾巴掌，損失閱歷 ${xpLost}`,true);toast('逃走失敗！閱歷 -'+xpLost)}
    return;
  }
  if(type==='gift'){
    if(p.gifts[key]===worldDay)return;
    p.gifts[key]=worldDay;const btn=$('btnGift');if(btn)btn.disabled=true;
    pushDlg('（你奉上一份禮物）',true);
    setTimeout(()=>{
      pushDlg('（'+esc(n.name)+'接過，神色微動）你有心。',false);
      bumpAff(key,4);toast('贈禮 · 好感 +4');
      const na=n.alignment||500;
      if(na>playerAlign())setPlayerAlign(1);else if(na<playerAlign())setPlayerAlign(-1);
    },400);
  }else if(type==='spar'){
    if(p.spoke[key+'#spar']===worldDay)return;
    p.spoke[key+'#spar']=worldDay;const btn=$('btnSpar');if(btn)btn.disabled=true;
    const a=aff(key),na=n.alignment||500;
    const win=Math.random()<(0.35+a/200);
    p.xp+=win?5:3;savePlayer(p);
    pushDlg('（你抱拳：請指教！）',true);
    setTimeout(()=>{
      if(win){pushDlg('（過了三招，'+esc(n.name)+'收勢）有幾下本領！給你面子。',false);bumpAff(key,3);toast('切磋勝 · 閱歷 +5 · 好感 +3')}
      else{pushDlg('（三招之內被制住）年輕人，基本功回去再練練。',false);bumpAff(key,-1);toast('切磋敗 · 閱歷 +3 · 好感 -1')}
      if(win&&na>=600)setPlayerAlign(2);else if(!win&&na<400)setPlayerAlign(-1);
      $('playerXp').textContent=p.xp;
    },400);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&$('auth').classList.contains('open')){
    if(authMode==='reg'&&document.activeElement&&document.activeElement.id!=='regPass2'){$('regPass2').focus();return}
    authMode==='reg'?regGo():loginGo();
  }
});
load();
</script>
</body>
</html>
