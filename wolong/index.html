<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>臥龍傳 | 懷舊 DOS 遊戲 — 食息鴨</title>
<link rel="stylesheet" href="./js-dos.css">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0c0c12; color: #e0ddd5; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; letter-spacing: 2px; }
  header h1 a { color: #d4af37; text-decoration: none; }
  header .sub { font-size: 12px; color: #6b6b7b; }
  .spacer { flex: 1; }
  .btn { background: #1c1c2a; color: #e0ddd5; border: 1px solid #d4af37; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn:active { background: #d4af37; color: #0c0c12; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; min-height: 0; }
  #dos { width: 100%; max-width: 960px; aspect-ratio: 4 / 3; background: #000; border: 1px solid #2a2a3a; border-radius: 8px; overflow: hidden; touch-action: none; }
  /* 唔好強制拉伸 canvas：js-dos 自己會按比例算好尺寸同置中，
     我哋蓋咗佢會令畫面非等比拉伸、游標同實際畫面唔對位。 */
  .hint { padding: 10px 16px 16px; font-size: 12px; color: #6b6b7b; line-height: 1.8; }
  .hint b { color: #d4af37; }
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 6px 12px; }
    header h1 { font-size: 15px; }
    #stage { padding: 4px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🐉 <a href="/">臥龍傳</a></h1>
  <span class="sub">臥竜伝 三国制覇の計 · DOS 懷舊遊戲 · 食息鴨</span>
  <span class="spacer"></span>
  <button class="btn" id="btnFs">⛶ 全螢幕</button>
  <button class="btn" id="btnKb">⌨️ 鍵盤</button>
</header>
<div id="stage"><div id="dos"></div></div>
<div class="hint">
  📱 <b>手機玩法：</b>建議轉橫屏遊玩。點一下 = 滑鼠左鍵；撳住唔放 = 按住左鍵（過密碼「確定」用）；拖曳 = 郁游標。撳「⌨️ 鍵盤」叫出輸入鍵盤；「⛶ 全螢幕」放大畫面。<br>
  🖥️ <b>電腦：</b>點一下畫面鎖定滑鼠，Esc 解鎖。遊戲內遇到密碼，直接用滑鼠點擊「决定」。<br>
  🔑 <b>過密碼關：</b>手指<b>點住「確定」唔好放（約1秒）</b>再鬆開，遊戲就會過關。輕輕撳一下可能冇反應。<br>
  💾 遊戲進度自動存喺呢部裝置（瀏覽器儲存空間），唔使擔心唔見 save。<br>
  ⚠️ 懷舊遊戲僅供測試交流，請支持正版。
</div>
<script src="./js-dos.js"></script>
<script>
(function () {
  var el = document.getElementById("dos");
  var ci = null;

  Dos(el, {
    url: "./wolong.jsdos",
    pathPrefix: "./emulators/",
    theme: "dark",
    backend: "dosboxX",
    backendLocked: true,
    onEvent: function (ev, arg) {
      if (ev === "ci-ready") {
        ci = arg;
        window.__ci = arg;
        window.__ciReady = true;
      }
    }
  });

  // ---- 送 mouse 事件（座標 0..1；游標由遊戲自己畫）----
  function sendMotion(x, y) {
    if (!ci) { return; }
    try { ci.sendMouseMotion(x, y); } catch (e) {}
  }
  function sendBtn(b, down) {
    if (!ci) { return; }
    try { ci.sendMouseButton(b, down); } catch (e) {}
  }
  // 掣最少按住幾耐（DOS 遊戲多數 poll 得慢，太短會當冇撳過）
  var MIN_PRESS_MS = 160;
  // 送游標位置之後，等遊戲 poll 到先送 button，否則會用舊位置判定
  var SETTLE_MS = 100;

  function eat(e) {
    if (!e) { return; }
    if (e.cancelable) { e.preventDefault(); }
    e.stopPropagation();
    if (e.stopImmediatePropagation) { e.stopImmediatePropagation(); }
  }

  // 遊戲 canvas 內容區 → 0..1（同 js-dos 內部算法一致：
  // canvas 係置中內容區，rect 入面黑邊唔係遊戲，要扣咗先 map）
  function toGame(clientX, clientY) {
    var c = el.querySelector("canvas");
    if (!c || !ci || typeof ci.width !== "function") { return null; }
    var r = c.getBoundingClientRect();
    var sw = 0, sh = 0;
    try { sw = ci.width(); sh = ci.height(); } catch (e) {}
    if (!sw || !sh || r.width <= 0 || r.height <= 0) { return null; }
    var ar = sw / sh;
    var w = r.width, h = r.width / ar;
    if (h > r.height) { h = r.height; w = r.height * ar; }
    var offX = (r.width - w) / 2, offY = (r.height - h) / 2;
    var x = Math.max(0, Math.min(1, (clientX - r.left - offX) / w));
    var y = Math.max(0, Math.min(1, (clientY - r.top - offY) / h));
    return { x: x, y: y };
  }

  // ---- 觸控層：tap = 左鍵，撳住 = 按住左鍵，拖 = 淨郁游標 ----
  // 掛喺 canvas 專用容器（唔包 sidebar，唔會冚住功能掣）。
  // 未 ci-ready 之前唔攔截，等 ▶ 可以正常撳。
  var TAP_PX = 14;       // 郁多過呢個 = 拖
  var HOLD_MS = 400;     // 撳住唔郁超過呢個 = 按住左鍵
  var HOLD_KEEP_MS = 700; // 按住最少總時長（過密碼「確定」）

  function buildTouch() {
    var c = el.querySelector("canvas");
    var host = (c && c.parentElement) || el;
    if (!host || document.getElementById("touchLayer")) { return; }
    if (getComputedStyle(host).position === "static") { host.style.position = "relative"; }

    var layer = document.createElement("div");
    layer.id = "touchLayer";
    layer.style.cssText = "position:absolute;inset:0;z-index:40;touch-action:none;background:transparent;pointer-events:auto;";
    host.appendChild(layer);

    var sx = 0, sy = 0, moved = false, held = false, holdTimer = null, pressStart = 0;

    function clearHold() {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    }

    layer.addEventListener("touchstart", function (e) {
      if (!ci || e.touches.length !== 1) { return; }
      var t = e.touches[0];
      sx = t.clientX; sy = t.clientY;
      moved = false; held = false;
      clearHold();
      // 手指一落 → 游標即刻跳去嗰點
      var p = toGame(t.clientX, t.clientY);
      if (p) { sendMotion(p.x, p.y); }
      // 撳住唔郁 → 按住左鍵（過密碼「確定」嗰類掣）
      holdTimer = setTimeout(function () {
        holdTimer = null;
        if (!moved && ci) {
          held = true;
          pressStart = Date.now();
          sendBtn(0, true);
        }
      }, HOLD_MS);
      eat(e);
    }, { passive: false });

    layer.addEventListener("touchmove", function (e) {
      if (!ci || e.touches.length !== 1) { return; }
      var t = e.touches[0];
      if (!moved && Math.hypot(t.clientX - sx, t.clientY - sy) > TAP_PX) {
        moved = true;
        if (!held) { clearHold(); }
      }
      // 拖 = 淨係郁游標，唔按任何掣
      var p = toGame(t.clientX, t.clientY);
      if (p) { sendMotion(p.x, p.y); }
      eat(e);
    }, { passive: false });

    function finish(e) {
      if (!ci) { return; }
      var t = (e.changedTouches && e.changedTouches[0]) || null;
      if (!t) { return; }
      var wasHeld = held, wasMoved = moved;
      held = false;
      clearHold();

      if (wasHeld) {
        // 保證按住夠長，再放手
        var heldFor = Date.now() - pressStart;
        var wait = Math.max(0, HOLD_KEEP_MS - heldFor);
        setTimeout(function () { sendBtn(0, false); }, wait);
        eat(e);
        return;
      }
      if (wasMoved) { eat(e); return; }

      // tap = 左鍵：先確認游標已到位，等遊戲 poll 到，之後才送 button
      var p = toGame(t.clientX, t.clientY);
      if (p) { sendMotion(p.x, p.y); }
      setTimeout(function () {
        sendBtn(0, true);
        setTimeout(function () { sendBtn(0, false); }, MIN_PRESS_MS);
      }, SETTLE_MS);
      eat(e);
    }
    layer.addEventListener("touchend", finish, { passive: false });
    layer.addEventListener("touchcancel", finish, { passive: false });

    // 唔俾 player 自己再插一手（佢綁喺 canvas 嘅 pointer 事件會用錯座標多送一次）
    ["pointerdown", "pointermove", "pointerup", "pointercancel"].forEach(function (type) {
      layer.addEventListener(type, function (e) { eat(e); }, { capture: true, passive: false });
    });
  }

  // player 轉場／轉 video mode 會重建 DOM：每 2 秒驗一次，
  // touchLayer 丟咗就重掛；player 自帶 mouseOverlay 用相對座標會打架，撳熄佢。
  setInterval(function () {
    if (!ci) { return; }
    var c = el.querySelector("canvas");
    if (!c) { return; }
    var host = c.parentElement || el;
    var layer = document.getElementById("touchLayer");
    if (!layer || !layer.isConnected || layer.parentElement !== host) {
      if (layer && layer.parentElement) {
        try { layer.parentElement.removeChild(layer); } catch (e) {}
      }
      buildTouch();
      return;
    }
    var ov = host.querySelector(".emulator-mouse-overlay");
    if (ov && ov.style.display !== "none") { ov.style.display = "none"; }
  }, 2000);

  document.getElementById("btnFs").addEventListener("click", function () {
    var s = document.getElementById("stage");
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (s.requestFullscreen) { s.requestFullscreen(); }
    else if (s.webkitRequestFullscreen) { s.webkitRequestFullscreen(); }
  });
  document.getElementById("btnKb").addEventListener("click", function () {
    // 撳模擬器側欄個鍵盤掣（認 viewBox 507.9 嗰個就係）
    var btns = document.querySelectorAll(".sidebar-button");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].innerHTML.indexOf("507.9") !== -1) { btns[i].click(); return; }
    }
    alert("遊戲未載入完成，請先撳 ▶ 開始遊戲，再撳此按鈕。");
  });
})();
</script>
</body>
</html>
