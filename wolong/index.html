<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>臥龍傳 | 懷舊 DOS 遊戲 — 食息鴨</title>
<link rel="stylesheet" href="./js-dos.css">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0c0c12; color: #e0ddd5; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; letter-spacing: 2px; }
  header h1 a { color: #d4af37; text-decoration: none; }
  header .sub { font-size: 12px; color: #6b6b7b; }
  .spacer { flex: 1; }
  .btn { background: #1c1c2a; color: #e0ddd5; border: 1px solid #d4af37; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn:active { background: #d4af37; color: #0c0c12; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; min-height: 0; }
  #dos { width: 100%; max-width: 960px; aspect-ratio: 4 / 3; background: #000; border: 1px solid #2a2a3a; border-radius: 8px; overflow: hidden; touch-action: none; }
  #dos canvas { width: 100% !important; height: 100% !important; }
  .hint { padding: 10px 16px 16px; font-size: 12px; color: #6b6b7b; line-height: 1.8; }
  .hint b { color: #d4af37; }
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 6px 12px; }
    header h1 { font-size: 15px; }
    #stage { padding: 4px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🐉 <a href="/">臥龍傳</a></h1>
  <span class="sub">臥竜伝 三国制覇の計 · DOS 懷舊遊戲 · 食息鴨</span>
  <span class="spacer"></span>
  <button class="btn" id="btnFs">⛶ 全螢幕</button>
  <button class="btn" id="btnKb">⌨️ 鍵盤</button>
</header>
<div id="stage"><div id="dos"></div></div>
<div class="hint">
  📱 <b>手機玩法：</b>建議轉橫屏遊玩。點畫面 = 滑鼠點擊；撳「⌨️ 鍵盤」叫出輸入鍵盤；「⛶ 全螢幕」放大畫面。<br>
  🖥️ <b>電腦：</b>點一下畫面鎖定滑鼠，Esc 解鎖。遊戲內遇到密碼，直接用滑鼠點擊「决定」。<br>
  💾 遊戲進度自動存喺呢部裝置（瀏覽器儲存空間），唔使擔心唔見 save。<br>
  ⚠️ 懷舊遊戲僅供測試交流，請支持正版。
</div>
<script src="./js-dos.js"></script>
<script>
(function () {
  var el = document.getElementById("dos");
  var ci = null;

  Dos(el, {
    url: "./wolong.jsdos",
    pathPrefix: "./emulators/",
    theme: "dark",
    lang: "zh",
    backend: "dosbox",
    backendLocked: true,
    mobileControls: true,
    softKeyboard: false,
    kiosk: false
  });

  document.getElementById("btnFs").addEventListener("click", function () {
    var s = document.getElementById("stage");
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (s.requestFullscreen) { s.requestFullscreen(); }
    else if (s.webkitRequestFullscreen) { s.webkitRequestFullscreen(); }
  });
  document.getElementById("btnKb").addEventListener("click", function () {
    if (ci && ci.sendBackendEvent) {
      try { ci.sendBackendEvent({ type: "soft-keyboard-toggle" }); } catch (e) {}
    }
    alert("如果鍵盤冇彈出，請先點一下遊戲畫面，再撳此按鈕。");
  });
})();
</script>
</body>
</html>
