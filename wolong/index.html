<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>臥龍傳 | 懷舊 DOS 遊戲 — 食息鴨</title>
<link rel="stylesheet" href="./js-dos.css">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0c0c12; color: #e0ddd5; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; letter-spacing: 2px; }
  header h1 a { color: #d4af37; text-decoration: none; }
  header .sub { font-size: 12px; color: #6b6b7b; }
  .spacer { flex: 1; }
  .btn { background: #1c1c2a; color: #e0ddd5; border: 1px solid #d4af37; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn:active { background: #d4af37; color: #0c0c12; }
  #stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 8px; min-height: 0; overflow-y: auto; }
  #dos { width: 100%; max-width: 960px; aspect-ratio: 4 / 3; max-height: calc(100dvh - 90px); background: #000; border: 1px solid #2a2a3a; border-radius: 8px; overflow: hidden; touch-action: none; }
  #dos canvas { object-fit: contain; }
  .hint { padding: 10px 16px 16px; font-size: 12px; color: #6b6b7b; line-height: 1.8; }
  .hint b { color: #d4af37; }
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 6px 12px; }
    header h1 { font-size: 15px; }
    #stage { padding: 4px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🐉 <a href="/">臥龍傳</a></h1>
  <span class="sub">臥竜伝 三国制覇の計 · DOS 懷舊遊戲 · 食息鴨</span>
  <span class="spacer"></span>
  <button class="btn" id="btnFs">⛶ 全螢幕</button>
  <button class="btn" id="btnKb">⌨️ 鍵盤</button>
  <button class="btn" id="btnDbg" style="display:none;">🐞 座標</button>
</header>
<div id="stage"><div id="dos"></div></div>
<div class="hint">
  📱 <b>觸控（手機）：</b>點一下 = 滑鼠左鍵；連點兩下 = 滑鼠右鍵；撳住唔放／拖曳 = 撳住左鍵（滑動地圖、點住「確定」過關）。入地圖後如游標亂飛，撳右下角切換做「🧭 觸控板模式」。建議轉橫屏遊玩；撳「⌨️ 鍵盤」叫出輸入鍵盤。<br>
  🖥️ <b>電腦：</b>點一下畫面鎖定滑鼠，Esc 解鎖。遊戲內遇到密碼，直接用滑鼠點擊「决定」（點住約1秒再鬆開）。<br>
  💾 遊戲進度自動存喺呢部裝置（瀏覽器儲存空間），唔使擔心唔見 save。<br>
  ⚠️ 懷舊遊戲僅供測試交流，請支持正版。<br>
</div>
<script src="./js-dos.js"></script>
<script>
(function () {
  var el = document.getElementById("dos");
  var ci = null;          // CommandInterface, filled on ci-ready
  var IS_TOUCH = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

  Dos(el, {
    url: "./wolong.jsdos",
    pathPrefix: "./emulators/",
    theme: "dark",
    backend: "dosboxX",
    backendLocked: true,
    renderAspect: "4/3",
    onEvent: function (ev, arg) {
      if (ev === "ci-ready") {
        ci = arg; window.__ciReady = true;
        var tl = document.getElementById("touchLayer");
        if (tl) { tl.style.display = "block"; }
        var mb = document.getElementById("touchModeBtn");
        if (mb) { mb.style.display = "block"; }
        var db = document.getElementById("btnDbg");
        if (db && IS_TOUCH) { db.style.display = ""; }
      }
    }
  });

  // ---------- 自訂觸控層（mobile only）：tap=左鍵、double-tap=右鍵、drag=滑動 ----------
  // 注意：冇 ci（未 ci-ready）之前唔攔截，等 Play 掣可以正常撳
  // 兩種模式：touchscreen（點邊打邊，預設）/ touchpad（觸控板，相對移動）
  // 地圖畫面如果遊戲轉咗 relative mouse，用觸控板模式先掂
  var TOUCH_MODE = "touchscreen";
  try {
    if (localStorage.getItem("wolong_touchmode") === "touchpad") { TOUCH_MODE = "touchpad"; }
  } catch (e) {}
  if (IS_TOUCH) {
    var layer = document.createElement("div");
    layer.id = "touchLayer";
    layer.style.cssText = "position:absolute;inset:0;z-index:30;touch-action:none;display:none;";
    var modeBtn = document.createElement("button");
    modeBtn.id = "touchModeBtn";
    modeBtn.style.cssText = "position:fixed;right:12px;bottom:12px;z-index:60;display:none;" +
      "background:#1c1c2a;color:#d4af37;border:1px solid #d4af37;border-radius:20px;" +
      "padding:10px 14px;font-size:13px;opacity:0.9;";
    document.body.appendChild(modeBtn);
    var refreshModeBtn = function () {
      modeBtn.textContent = (TOUCH_MODE === "touchscreen") ? "🖱️ 觸屏模式" : "🧭 觸控板模式";
    };
    refreshModeBtn();
    modeBtn.addEventListener("click", function () {
      TOUCH_MODE = (TOUCH_MODE === "touchscreen") ? "touchpad" : "touchscreen";
      try { localStorage.setItem("wolong_touchmode", TOUCH_MODE); } catch (e) {}
      refreshModeBtn();
    });
    window.__getTouchMode = function () { return TOUCH_MODE; };
    var anchorLayer = function () {
      var anchor = el.querySelector(".bg-black.h-full") || el;
      if (anchor && getComputedStyle(anchor).position === "static") {
        anchor.style.position = "relative";
      }
      if (anchor && !layer.isConnected) {
        anchor.appendChild(layer);
        bindTouch(layer);
      }
    };
    // 等 player 建好 stage 結構先掛上去；之後每 2s 檢查（遊戲切畫面可能重建 DOM）
    var mountTimer = setInterval(function () {
      anchorLayer();
      if (ci) { clearInterval(mountTimer); }
    }, 200);
    setInterval(function () {
      if (ci && !layer.isConnected) { anchorLayer(); }
    }, 2000);
  }

  // canvas 內容區 → 0..1 座標
  // 遊戲會轉 video mode（選單一個、地圖一個），canvas attr 會跟住變，
  // 所以每次 touch 都重讀 canvas.width/height，用 aspect-fit 計出內容區（置中＋黑邊）。
  function toGameXY(clientX, clientY) {
    var canvas = el.querySelector("canvas");
    if (!canvas) { return null; }
    var aw = canvas.width || 640, ah = canvas.height || 480;
    var r = canvas.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) { return null; }
    var scale = Math.min(r.width / aw, r.height / ah);
    var lw = aw * scale, lh = ah * scale;
    var px = (r.width - lw) / 2, py = (r.height - lh) / 2;
    var cssX = clientX - r.left - px, cssY = clientY - r.top - py;
    if (cssX < 0 || cssY < 0 || cssX > lw || cssY > lh) { return null; }
    return { x: cssX / lw, y: cssY / lh };
  }

  function click(btn, holdMs) {
    if (!ci) { return; }
    try {
      ci.sendMouseButton(btn, true);
      setTimeout(function () {
        try { ci.sendMouseButton(btn, false); } catch (e) {}
      }, holdMs || 60);
    } catch (e) {}
  }

  // ---------- 座標除錯：每下 touch 記低 client XY + 算出嚟嘅 game XY + canvas 狀態 ----------
  window.__touchLog = [];
  function logTouch(kind, clientX, clientY, game) {
    var canvas = el.querySelector("canvas");
    var r = canvas ? canvas.getBoundingClientRect() : null;
    window.__touchLog.push({
      kind: kind,
      client: [Math.round(clientX), Math.round(clientY)],
      game: game ? [+game.x.toFixed(3), +game.y.toFixed(3)] : null,
      canvasAttr: canvas ? [canvas.width, canvas.height] : null,
      canvasRect: r ? [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)] : null,
      t: Date.now()
    });
    if (window.__touchLog.length > 50) { window.__touchLog.shift(); }
  }
  document.getElementById("btnDbg").addEventListener("click", function () {
    var lines = window.__touchLog.slice(-8).map(function (e, i) {
      return (i + 1) + ". " + e.kind + " 手指(" + e.client + ") → 遊戲(" + e.game + ") 畫布" + e.canvasAttr + " 矩形" + e.canvasRect;
    });
    alert(lines.length ? lines.join("\n") : "未撳過遊戲區");
  });

  function bindTouch(layer) {
    var startX = 0, startY = 0, startT = 0;
    var lastTapT = 0, lastTapX = 0, lastTapY = 0;
    var moved = false, downSent = false, longTimer = null, pendingLeft = null;
    var TAP_MS = 350, TAP_PX = 14, DBL_MS = 320, DBL_PX = 30, LONG_MS = 350;
    function clearLong() { if (longTimer) { clearTimeout(longTimer); longTimer = null; } }
    function clearPending() { if (pendingLeft) { clearTimeout(pendingLeft); pendingLeft = null; } }

    layer.addEventListener("touchstart", function (e) {
      if (!ci || e.touches.length !== 1) { return; }
      // 上一下 tap 仲等緊確認係咪 double-tap（delayed 左鍵未送出）：取消佢
      clearPending();
      var t = e.touches[0];
      startX = t.clientX; startY = t.clientY; startT = Date.now();
      moved = false; downSent = false;
      clearLong();
      // 長撳唔郁：350ms 後當拖曳起點（㩒住左鍵），方便過「確定」呢類要 hold 嘅掣
      (function (sx, sy) {
        longTimer = setTimeout(function () {
          if (!moved && ci) {
            moved = true;
            var p = toGameXY(sx, sy);
            if (p) {
              try {
                ci.sendMouseMotion(p.x, p.y);
                ci.sendMouseButton(0, true);
                downSent = true;
              } catch (err) {}
            }
          }
          longTimer = null;
        }, LONG_MS);
      })(startX, startY);
      e.preventDefault();
    }, { passive: false });

    layer.addEventListener("touchmove", function (e) {
      if (!ci || e.touches.length !== 1) { return; }
      var t = e.touches[0];
      var dx = t.clientX - startX, dy = t.clientY - startY;
      if (TOUCH_MODE === "touchpad") {
        // 觸控板模式：手指位移 → 相對 mouse motion（唔㩒掣純郁 cursor；
        // 單指拖曳就㩒住左鍵拖）
        var canvas = el.querySelector("canvas");
        var r = canvas ? canvas.getBoundingClientRect() : { width: 800, height: 600 };
        var rx = dx / r.width, ry = dy / r.height;
        try {
          if (!moved && Math.hypot(dx, dy) > TAP_PX) {
            moved = true; downSent = true;
            ci.sendMouseButton(0, true);
          }
          if (moved) { ci.sendMouseRelativeMotion(rx, ry); }
          else { ci.sendMouseRelativeMotion(rx * 0.2, ry * 0.2); }
        } catch (err) {}
        startX = t.clientX; startY = t.clientY;   // 增量式
        e.preventDefault();
        return;
      }
      if (!moved && Math.hypot(dx, dy) > TAP_PX) {
        clearLong();
        moved = true;
        // 開始拖曳：按住左鍵 + 同步 mouse motion
        var p = toGameXY(startX, startY);
        if (p) {
          try {
            ci.sendMouseMotion(p.x, p.y);
            ci.sendMouseButton(0, true);
            downSent = true;
          } catch (err) {}
        }
      }
      if (moved) {
        var q = toGameXY(t.clientX, t.clientY);
        if (q) { try { ci.sendMouseMotion(q.x, q.y); } catch (err) {} }
      }
      e.preventDefault();
    }, { passive: false });

    layer.addEventListener("touchend", function (e) {
      if (!ci) { return; }
      clearLong();
      if (TOUCH_MODE === "touchpad") {
        // 觸控板：tap = 左鍵 click；拖完放開左鍵
        try { if (downSent) { ci.sendMouseButton(0, false); } } catch (err) {}
        if (!moved) {
          var dt0 = Date.now() - startT;
          if (dt0 <= TAP_MS) { click(0, 120); }
        }
        downSent = false; moved = false; lastTapT = 0;
        e.preventDefault();
        return;
      }
      var dt = Date.now() - startT;
      var t = e.changedTouches[0];
      if (moved) {
        // 拖曳結束：補最後位置 + 放開左鍵
        var q = toGameXY(t.clientX, t.clientY);
        try {
          if (q) { ci.sendMouseMotion(q.x, q.y); }
          if (downSent) { ci.sendMouseButton(0, false); }
        } catch (err) {}
        lastTapT = 0;   // 拖曳唔計入 double-tap
        e.preventDefault();
        return;
      }
      if (dt > TAP_MS && !moved) { lastTapT = 0; e.preventDefault(); return; }  // 長撳但 timer 未起動（極少見）
      var now = Date.now();
      var p = toGameXY(t.clientX, t.clientY);
      logTouch("tap", t.clientX, t.clientY, p);
      if (!p) { e.preventDefault(); return; }
      if (now - lastTapT < DBL_MS &&
          Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < DBL_PX) {
        try { ci.sendMouseMotion(p.x, p.y); } catch (err) {}
        click(1);            // 第二下 → 右鍵（唔送左鍵）
        lastTapT = 0;
      } else if (TOUCH_MODE === "touchpad") {
        // 觸控板模式第一點：即送 motion＋短左鍵（唔等 double-tap，
        // 觸控板無右鍵手勢，唔使 delay）
        try {
          ci.sendMouseMotion(p.x, p.y);
          ci.sendMouseButton(0, true);
          setTimeout(function () {
            try { ci.sendMouseButton(0, false); } catch (e2) {}
          }, 120);
        } catch (err) {}
        lastTapT = 0;
      } else {
        // 第一點：等 DBL_MS，期間無第二下先送左鍵（短撳 120ms 就夠；
        // 長撳 hold 靠 longTimer（350ms 起動㩒住唔放），唔好喺度 hold 800ms——
        // 地圖撳城 hold 太耐會變拖曳，地圖捲走，cursor 睇落似飛走）。
        // 有第二下就變右鍵，左鍵唔送——唔會再有多餘左鍵彈 cursor。
        (function (pp) {
          pendingLeft = setTimeout(function () {
            pendingLeft = null;
            try {
              ci.sendMouseMotion(pp.x, pp.y);
              ci.sendMouseButton(0, true);
              setTimeout(function () {
                try { ci.sendMouseButton(0, false); } catch (e2) {}
              }, 120);
            } catch (err) {}
          }, DBL_MS);
        })(p);
        lastTapT = now; lastTapX = t.clientX; lastTapY = t.clientY;
      }
      e.preventDefault();
    }, { passive: false });

    layer.addEventListener("touchcancel", function () {
      clearLong(); clearPending();
      if (ci && downSent) { try { ci.sendMouseButton(0, false); } catch (e) {} }
      downSent = false; moved = false; lastTapT = 0;
    });
  }

  document.getElementById("btnFs").addEventListener("click", function () {
    var s = document.getElementById("stage");
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (s.requestFullscreen) { s.requestFullscreen(); }
    else if (s.webkitRequestFullscreen) { s.webkitRequestFullscreen(); }
  });
  document.getElementById("btnKb").addEventListener("click", function () {
    var btns = document.querySelectorAll(".sidebar-button");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].innerHTML.indexOf("507.9") !== -1) { btns[i].click(); return; }
    }
    alert("遊戲未載入完成，請先撳 ▶ 開始遊戲，再撳此按鈕。");
  });
})();
</script>
</body>
</html>
