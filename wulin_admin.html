<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神鵰世界 · 後台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--card2:#1a1a25;--border:#2a2a3a;--gold:#d4af37;--gold2:#c9a84c;--text:#e0ddd5;--muted:#6b6b7b;--red:#e74c3c;--green:#2ecc71;--blue:#3498db;--purple:#9b59b6}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif SC','SimSun',serif;min-height:100vh}
.header{background:linear-gradient(135deg,#0d0d15,#1a1a28);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;color:var(--gold);letter-spacing:4px}
.header .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit;transition:.2s}
.tab:hover{border-color:var(--gold2);color:var(--text)}
.tab.active{background:rgba(212,175,55,.1);border-color:var(--gold);color:var(--gold)}
.main{max-width:1200px;margin:0 auto;padding:20px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;color:var(--gold);margin-bottom:12px;letter-spacing:2px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,textarea,select{width:100%;padding:8px 10px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{min-height:60px;resize:vertical}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;transition:.2s}
.btn:hover{border-color:var(--gold2)}
.btn-primary{background:rgba(212,175,55,.15);border-color:var(--gold);color:var(--gold)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin:2px}
.tag-martial{background:rgba(192,57,43,.15);color:#e74c3c}
.tag-neigong{background:rgba(46,204,113,.15);color:#2ecc71}
.tag-qinggong{background:rgba(52,152,219,.15);color:#3498db}
.tag-legendary{border:1px solid rgba(212,175,55,.4)}
.tag-rare{border:1px solid rgba(155,89,182,.3)}
.tag-uncommon{border:1px solid rgba(149,165,166,.2)}
.tag-common{border:1px solid rgba(100,100,102,.2)}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.2s}
.list-item:hover{border-color:var(--gold2);background:var(--card2)}
.list-item.active{border-color:var(--gold);background:rgba(212,175,55,.05)}
.list-item .name{flex:1;font-size:14px}
.list-item .meta{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:.3s}
.toast.show{opacity:1}
.toast.ok{background:rgba(46,204,113,.9);color:#fff}
.toast.err{background:rgba(231,76,60,.9);color:#fff}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.loading{text-align:center;padding:20px;color:var(--muted)}
.skill-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.skill-row:last-child{border-bottom:none}
.skill-row .sk-name{flex:1;font-size:13px}
.skill-row .sk-meta{font-size:11px;color:var(--muted)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{color:var(--gold);margin-bottom:16px}
.modal .close{float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px}
.stat-bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.stat-bar label{width:50px;margin:0}
.stat-bar input[type=range]{flex:1;accent-color:var(--gold)}
.stat-bar .val{width:30px;text-align:right;font-size:13px;color:var(--gold)}
.search{margin-bottom:12px}
.search input{width:100%;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.world-info{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.world-info .chip{padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;font-size:12px}
.world-info .chip b{color:var(--gold)}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>神鵰世界 · 後台</h1>
    <div class="sub">Wulin Admin Panel</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('npcs')">角色管理</button>
    <button class="tab" onclick="showTab('skills')">技能管理</button>
    <button class="tab" onclick="showTab('npcskills')">角色技能</button>
    <button class="tab" onclick="showTab('players')">玩家管理</button>
  </div>
</div>

<div class="main">
  <!-- NPC Panel -->
  <div id="panel-npcs" class="panel active">
    <div class="world-info" id="worldInfo"></div>
    <div class="grid grid-2">
      <div>
        <div class="search"><input id="npcSearch" placeholder="搜索角色…" oninput="filterNpcs()"></div>
        <div id="npcList" class="grid" style="gap:6px"></div>
        <div class="btn-row"><button class="btn btn-primary" onclick="showAddNpc()">+ 新增角色</button></div>
      </div>
      <div>
        <div class="card" id="npcEditor">
          <div class="empty">← 選擇一個角色</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Skills Panel -->
  <div id="panel-skills" class="panel">
    <div class="grid grid-2">
      <div>
        <div class="search"><input id="skillSearch" placeholder="搜索技能…" oninput="filterSkills()"></div>
        <div id="skillList" class="grid" style="gap:6px"></div>
        <div class="btn-row"><button class="btn btn-primary" onclick="showAddSkill()">+ 新增技能</button></div>
      </div>
      <div>
        <div class="card" id="skillEditor">
          <div class="empty">← 選擇一個技能</div>
        </div>
      </div>
    </div>
  </div>

  <!-- NPC Skills Panel -->
  <div id="panel-npcskills" class="panel">
    <div class="grid grid-2">
      <div>
        <div class="search"><input id="nsSearch" placeholder="搜索角色…" oninput="filterNpcSkills()"></div>
        <div id="nsNpcList" class="grid" style="gap:6px"></div>
      </div>
      <div>
        <div class="card" id="nsEditor">
          <div class="empty">← 選擇一個角色查看技能</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Players Panel -->
  <div id="panel-players" class="panel">
    <div class="grid grid-2">
      <div>
        <div class="search"><input id="playerSearch" placeholder="搜索玩家…" oninput="filterPlayers()"></div>
        <div id="playerList" class="grid" style="gap:6px"></div>
      </div>
      <div>
        <div class="card" id="playerEditor">
          <div class="empty">← 選擇一個玩家</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<script>
const SUPABASE_URL='https://swsdzpakaywkxxngatiw.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3c2R6cGFrYXl3a3h4bmdhdGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODU1NTcsImV4cCI6MjEwNDI2MTU1N30.WGbiqYuXMHeWNf1u4Ou9-YAQxBp2KTxDy0vZKr4CJEk';
</script>
<script>
// ===== API Layer =====
async function apiGet(url){const r=await fetch(url,{headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`}});
if(!r.ok)throw new Error(`GET ${url}: ${r.status}`);return r.json()}
async function apiPost(url,body){const r=await fetch(url,{method:'POST',headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
if(!r.ok){const t=await r.text();throw new Error(`POST: ${r.status} ${t}`)}return r}
async function apiPatch(url,body){const r=await fetch(url,{method:'PATCH',headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
if(!r.ok){const t=await r.text();throw new Error(`PATCH: ${r.status} ${t}`)}return r}
async function apiDelete(url){const r=await fetch(url,{method:'DELETE',headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`,'Prefer':'return=minimal'}});
if(!r.ok){const t=await r.text();throw new Error(`DELETE: ${r.status} ${t}`)}return r}

// ===== State =====
let worldData=null, npcs=[], skills=[], npcSkills=[], players=[], selectedNpc=null, selectedSkill=null, selectedPlayer=null;

// ===== Helpers =====
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(ok?'ok':'err');setTimeout(()=>t.className='toast',2500)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showTab(name){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add('active');document.getElementById('panel-'+name).classList.add('active')}
function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('open')}

// ===== Load All =====
async function loadAll(){
  try{const wr=await fetch('data/wulin_world.json');worldData=await wr.json();npcs=worldData.npcs||[]}catch(e){npcs=[]}
  try{skills=await apiGet(`${SUPABASE_URL}/rest/v1/skills?select=*&order=type,power.desc`)}catch(e){skills=[]}
  try{npcSkills=await apiGet(`${SUPABASE_URL}/rest/v1/npc_skills?select=*&order=npc_key`)}catch(e){npcSkills=[]}
  try{players=await apiGet(`${SUPABASE_URL}/rest/v1/players?select=name,created_at&order=created_at.desc`)}catch(e){players=[]}
  renderWorldInfo();renderNpcList();renderSkillList();renderNsNpcList();renderPlayerList();
}

function renderWorldInfo(){
  if(!worldData)return;const m=worldData.meta||{};
  document.getElementById('worldInfo').innerHTML=`
    <div class="chip">🗓 <b>${m.world_time||'?'}</b></div>
    <div class="chip">🗺 <b>${Object.keys(m.region_distances||{}).length}</b> 區域</div>
    <div class="chip">👤 <b>${npcs.length}</b> 角色</div>
    <div class="chip">⚔️ <b>${skills.length}</b> 技能</div>
    <div class="chip">🔗 <b>${npcSkills.length}</b> 技能配置</div>
    <div class="chip">🎮 <b>${players.length}</b> 玩家</div>`;
}

// ===== NPC Management =====
function renderNpcList(filter=''){
  const el=document.getElementById('npcList');
  const f=filter.toLowerCase();
  const filtered=npcs.filter(n=>!f||n.name.includes(f)||n.key.includes(f)||(n.title||'').includes(f));
  if(!filtered.length){el.innerHTML='<div class="empty">冇角色</div>';return}
  el.innerHTML=filtered.map(n=>{
    const active=selectedNpc&&selectedNpc.key===n.key;
    return `<div class="list-item${active?' active':''}" onclick="selectNpc('${n.key}')">
      <div class="name">${esc(n.name)}</div>
      <div class="meta">${esc(n.title||'')} · ${esc(n.region||'')}</div>
    </div>`;
  }).join('');
}
function filterNpcs(){renderNpcList(document.getElementById('npcSearch').value)}

function selectNpc(key){
  selectedNpc=npcs.find(n=>n.key===key)||null;
  renderNpcList(document.getElementById('npcSearch').value);
  if(!selectedNpc){document.getElementById('npcEditor').innerHTML='<div class="empty">← 選擇一個角色</div>';return}
  const n=selectedNpc;
  const aff=n.alignment||500;
  document.getElementById('npcEditor').innerHTML=`
    <h3>${esc(n.name)} <span style="font-size:12px;color:var(--muted)">${esc(n.key)}</span></h3>
    <div class="grid grid-2">
      <div><label>姓名</label><input id="npcName" value="${esc(n.name)}"></div>
      <div><label>稱號</label><input id="npcTitle" value="${esc(n.title||'')}"></div>
      <div><label>區域</label><input id="npcRegion" value="${esc(n.region||'')}"></div>
      <div><label>位置</label><input id="npcLocation" value="${esc(n.location||'')}"></div>
    </div>
    <div style="margin-top:10px"><label>心境</label><input id="npcMood" value="${esc(n.mood||'')}"></div>
    <div style="margin-top:8px"><label>待人態度</label><input id="npcAttitude" value="${esc(n.attitude||'')}"></div>
    <div class="stat-bar" style="margin-top:10px">
      <label>道心</label>
      <input type="range" min="0" max="1000" value="${aff}" id="npcAlign" oninput="this.nextElementSibling.textContent=this.value">
      <span class="val">${aff}</span>
    </div>
    <div class="grid grid-3" style="margin-top:10px">
      <div class="stat-bar"><label>武功</label><input type="range" min="1" max="100" value="${n.martial||50}" id="npcMartial" oninput="this.nextElementSibling.textContent=this.value"><span class="val">${n.martial||50}</span></div>
      <div class="stat-bar"><label>內功</label><input type="range" min="1" max="100" value="${n.neigong||50}" id="npcNeigong" oninput="this.nextElementSibling.textContent=this.value"><span class="val">${n.neigong||50}</span></div>
      <div class="stat-bar"><label>輕功</label><input type="range" min="1" max="100" value="${n.qinggong||50}" id="npcQinggong" oninput="this.nextElementSibling.textContent=this.value"><span class="val">${n.qinggong||50}</span></div>
    </div>
    <div style="margin-top:10px">
      <label>對白（每行一句）</label>
      <textarea id="npcDialogue" rows="4">${(n.dialogue||[]).join('\n')}</textarea>
    </div>
    <div style="margin-top:10px">
      <label>關係（JSON）</label>
      <textarea id="npcRelations" rows="3">${JSON.stringify(n.relations||{},null,1)}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveNpc()">💾 保存到本地</button>
      <button class="btn btn-danger" onclick="deleteNpcConfirm()">🗑 刪除</button>
    </div>`;
}

async function saveNpc(){
  if(!selectedNpc)return;
  const idx=npcs.findIndex(n=>n.key===selectedNpc.key);
  if(idx<0)return;
  const n=npcs[idx];
  n.name=document.getElementById('npcName').value.trim();
  n.title=document.getElementById('npcTitle').value.trim();
  n.region=document.getElementById('npcRegion').value.trim();
  n.location=document.getElementById('npcLocation').value.trim();
  n.mood=document.getElementById('npcMood').value.trim();
  n.attitude=document.getElementById('npcAttitude').value.trim();
  n.alignment=parseInt(document.getElementById('npcAlign').value)||500;
  n.martial=parseInt(document.getElementById('npcMartial').value)||50;
  n.neigong=parseInt(document.getElementById('npcNeigong').value)||50;
  n.qinggong=parseInt(document.getElementById('npcQinggong').value)||50;
  n.dialogue=document.getElementById('npcDialogue').value.split('\n').map(s=>s.trim()).filter(Boolean);
  try{n.relations=JSON.parse(document.getElementById('npcRelations').value)}catch(e){}
  worldData.npcs=npcs;
  // Save to local file via download
  const blob=new Blob([JSON.stringify(worldData,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wulin_world.json';a.click();
  toast('✅ 已下載 wulin_world.json（手動上傳至 repo）');
  renderNpcList(document.getElementById('npcSearch').value);
  renderWorldInfo();
}

function deleteNpcConfirm(){
  if(!selectedNpc)return;
  if(!confirm(`確定刪除 ${selectedNpc.name}？`))return;
  npcs=npcs.filter(n=>n.key!==selectedNpc.key);
  worldData.npcs=npcs;
  selectedNpc=null;
  const blob=new Blob([JSON.stringify(worldData,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wulin_world.json';a.click();
  document.getElementById('npcEditor').innerHTML='<div class="empty">← 選擇一個角色</div>';
  renderNpcList(document.getElementById('npcSearch').value);
  renderWorldInfo();
  toast('✅ 已刪除');
}

function showAddNpc(){
  const key=prompt('新角色 key（英文，如 zhangwuji）:');
  if(!key)return;
  if(npcs.find(n=>n.key===key)){toast('key 已存在',false);return}
  const newNpc={key,name:key,title:'',region:'襄陽城',location:'',mood:'',attitude:'',alignment:500,martial:50,neigong:50,qinggong:50,dialogue:[],chat_options:[],relations:{}};
  npcs.push(newNpc);worldData.npcs=npcs;
  selectNpc(key);
  toast('✅ 新角色已建立，請填寫資料後保存');
}

// ===== Skill Management =====
const RARITY_LABEL={common:'凡',uncommon:'中',rare:'高',legendary:'絕'};
const TYPE_LABEL={martial:'⚔️武功',neigong:'🧘內功',qinggong:'💨輕功'};
const TYPE_CSS={martial:'tag-martial',neigong:'tag-neigong',qinggong:'tag-qinggong'};

function renderSkillList(filter=''){
  const el=document.getElementById('skillList');
  const f=filter.toLowerCase();
  const filtered=skills.filter(s=>!f||s.name.includes(f)||s.key.includes(f)||s.type.includes(f));
  if(!filtered.length){el.innerHTML='<div class="empty">冇技能</div>';return}
  el.innerHTML=filtered.map(s=>{
    const active=selectedSkill&&selectedSkill.key===s.key;
    return `<div class="list-item${active?' active':''}" onclick="selectSkill('${esc(s.key)}')">
      <span class="tag ${TYPE_CSS[s.type]||''} ${s.rarity}">${TYPE_LABEL[s.type]||s.type}</span>
      <div class="name">${esc(s.name)}</div>
      <div class="meta">⚡${s.power} ${RARITY_LABEL[s.rarity]||s.rarity}</div>
    </div>`;
  }).join('');
}
function filterSkills(){renderSkillList(document.getElementById('skillSearch').value)}

function selectSkill(key){
  selectedSkill=skills.find(s=>s.key===key)||null;
  renderSkillList(document.getElementById('skillSearch').value);
  if(!selectedSkill){document.getElementById('skillEditor').innerHTML='<div class="empty">← 選擇一個技能</div>';return}
  const s=selectedSkill;
  document.getElementById('skillEditor').innerHTML=`
    <h3>${esc(s.name)}</h3>
    <div class="grid grid-2">
      <div><label>Key</label><input id="skKey" value="${esc(s.key)}"></div>
      <div><label>名稱</label><input id="skName" value="${esc(s.name)}"></div>
      <div><label>類型</label><select id="skType">
        <option value="martial"${s.type==='martial'?' selected':''}>⚔️ 武功</option>
        <option value="neigong"${s.type==='neigong'?' selected':''}>🧘 內功</option>
        <option value="qinggong"${s.type==='qinggong'?' selected':''}>💨 輕功</option>
      </select></div>
      <div><label>稀有度</label><select id="skRarity">
        <option value="common"${s.rarity==='common'?' selected':''}>凡</option>
        <option value="uncommon"${s.rarity==='uncommon'?' selected':''}>中</option>
        <option value="rare"${s.rarity==='rare'?' selected':''}>高</option>
        <option value="legendary"${s.rarity==='legendary'?' selected':''}>絕</option>
      </select></div>
    </div>
    <div class="stat-bar" style="margin-top:10px">
      <label>威力</label>
      <input type="range" min="1" max="100" value="${s.power}" id="skPower" oninput="this.nextElementSibling.textContent=this.value">
      <span class="val">${s.power}</span>
    </div>
    <div style="margin-top:10px"><label>描述</label><textarea id="skDesc" rows="3">${esc(s.description||'')}</textarea></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveSkill()">💾 保存</button>
      <button class="btn btn-danger" onclick="deleteSkillConfirm()">🗑 刪除</button>
    </div>`;
}

async function saveSkill(){
  if(!selectedSkill)return;
  const body={
    key:document.getElementById('skKey').value.trim(),
    name:document.getElementById('skName').value.trim(),
    type:document.getElementById('skType').value,
    rarity:document.getElementById('skRarity').value,
    power:parseInt(document.getElementById('skPower').value)||50,
    description:document.getElementById('skDesc').value.trim()
  };
  if(!body.key||!body.name){toast('Key 和名稱不能為空',false);return}
  try{
    if(body.key===selectedSkill.key){
      // Update existing
      await apiPatch(`${SUPABASE_URL}/rest/v1/skills?key=eq.${encodeURIComponent(body.key)}`,body);
    }else{
      // Key changed — delete old, insert new
      await apiDelete(`${SUPABASE_URL}/rest/v1/skills?key=eq.${encodeURIComponent(selectedSkill.key)}`);
      await apiPost(`${SUPABASE_URL}/rest/v1/skills`,body);
    }
    skills=await apiGet(`${SUPABASE_URL}/rest/v1/skills?select=*&order=type,power.desc`);
    renderSkillList(document.getElementById('skillSearch').value);
    selectSkill(body.key);
    renderWorldInfo();
    toast('✅ 技能已保存');
  }catch(e){toast('❌ '+e.message,false)}
}

async function deleteSkillConfirm(){
  if(!selectedSkill)return;
  if(!confirm(`確定刪除「${selectedSkill.name}」？`))return;
  try{
    await apiDelete(`${SUPABASE_URL}/rest/v1/skills?key=eq.${encodeURIComponent(selectedSkill.key)}`);
    // Also remove from npc_skills
    await apiDelete(`${SUPABASE_URL}/rest/v1/npc_skills?skill_key=eq.${encodeURIComponent(selectedSkill.key)}`);
    skills=await apiGet(`${SUPABASE_URL}/rest/v1/skills?select=*&order=type,power.desc`);
    npcSkills=await apiGet(`${SUPABASE_URL}/rest/v1/npc_skills?select=*&order=npc_key`);
    selectedSkill=null;
    document.getElementById('skillEditor').innerHTML='<div class="empty">← 選擇一個技能</div>';
    renderSkillList(document.getElementById('skillSearch').value);
    renderNsNpcList();renderWorldInfo();
    toast('✅ 已刪除');
  }catch(e){toast('❌ '+e.message,false)}
}

    <h3>新增技能</h3>
    <div class="grid grid-2">

      <div><label>類型</label><select id="newSkType">

      </select></div>
      <div><label>稀有度</label><select id="newSkRarity">
        <option value="common">凡</option><option value="uncommon">中</option><option value="rare">高</option><option value="legendary">絕</option>
      </select></div>
    </div>
    <div class="stat-bar" style="margin-top:10px"><label>威力</label><input type="range" min="1" max="100" value="50" id="newSkPower" oninput="this.nextElementSibling.textContent=this.value"><span class="val">50</span></div>
    <div style="margin-top:10px"><label>描述</label><textarea id="newSkDesc" rows="2"></textarea></div>

async function addSkill(){
  const body={
    key:document.getElementById('newSkKey').value.trim(),
    name:document.getElementById('newSkName').value.trim(),
    type:document.getElementById('newSkType').value,
    rarity:document.getElementById('newSkRarity').value,
    power:parseInt(document.getElementById('newSkPower').value)||50,
    description:document.getElementById('newSkDesc').value.trim()
  };
  if(!body.key||!body.name){toast('Key 和名稱不能為空',false);return}
  try{
    await apiPost(`${SUPABASE_URL}/rest/v1/skills`,body);
    skills=await apiGet(`${SUPABASE_URL}/rest/v1/skills?select=*&order=type,power.desc`);
    renderSkillList(document.getElementById('skillSearch').value);
    document.getElementById('modalOverlay').classList.remove('open');
    renderWorldInfo();
    toast('✅ 技能已新增');
  }catch(e){toast('❌ '+e.message,false)}
}

// ===== NPC Skill Assignment =====
function renderNsNpcList(filter=''){
  const el=document.getElementById('nsNpcList');
  const f=filter.toLowerCase();
  const filtered=npcs.filter(n=>!f||n.name.includes(f)||n.key.includes(f));
  if(!filtered.length){el.innerHTML='<div class="empty">冇角色</div>';return}
  el.innerHTML=filtered.map(n=>{
    const count=npcSkills.filter(ns=>ns.npc_key===n.key).length;
    return `<div class="list-item" onclick="selectNsNpc('${n.key}')">
      <div class="name">${esc(n.name)}</div>
      <div class="meta">${count} 技能</div>
    </div>`;
  }).join('');
}
function filterNpcSkills(){renderNsNpcList(document.getElementById('nsSearch').value)}

function selectNsNpc(key){
  const npc=npcs.find(n=>n.key===key);
  if(!npc)return;
  const assigned=npcSkills.filter(ns=>ns.npc_key===key);
  const assignedKeys=new Set(assigned.map(a=>a.skill_key));
  const unassigned=skills.filter(s=>!assignedKeys.has(s.key));

  let html=`<h3>${esc(npc.name)} 的技能</h3>`;

  // Assigned skills
  html+=`<div style="margin-top:12px"><b style="color:var(--gold);font-size:13px">已配置 (${assigned.length})</b></div>`;
  if(assigned.length){
    html+=assigned.map(a=>{
      const sk=skills.find(s=>s.key===a.skill_key);
      const name=sk?sk.name:a.skill_key;
      const type=sk?sk.type:'';
      return `<div class="skill-row">
        <span class="tag ${TYPE_CSS[type]||''}">${TYPE_LABEL[type]||type}</span>
        <span class="sk-name">${esc(name)}</span>
        <span class="sk-meta">熟練度 ${a.proficiency||0}</span>
        <button class="btn btn-sm btn-danger" onclick="removeNpcSkill('${key}','${a.skill_key}')">✕</button>
      </div>`;
    }).join('');
  }else{html+=`<div class="empty" style="padding:10px">無</div>`}

  // Add skill
  html+=`<div style="margin-top:16px"><b style="color:var(--gold);font-size:13px">添加技能</b></div>`;
  if(unassigned.length){
    html+='<div style="margin-top:8px"><select id="nsSkillSelect" style="width:100%">';
    html+='<option value="">— 選擇技能 —</option>';
    for(const s of unassigned){
      html+='<option value="'+esc(s.key)+'">'+esc(s.name)+' ('+(TYPE_LABEL[s.type]||s.type)+', ⚡'+s.power+')</option>';
    }
    html+='</select></div>';
    html+=`<div class="stat-bar" style="margin-top:8px"><label>熟練度</label><input type="range" min="0" max="100" value="50" id="nsProf" oninput="this.nextElementSibling.textContent=this.value"><span class="val">50</span></div>`;
    html+=`<div class="btn-row"><button class="btn btn-primary" onclick="addNpcSkill('${key}')">➕ 添加</button></div>`;
  }else{html+=`<div class="empty" style="padding:10px">所有技能已配置</div>`}

  document.getElementById('nsEditor').innerHTML=html;
}

async function addNpcSkill(npcKey){
  const sel=document.getElementById('nsSkillSelect');
  const skillKey=sel.value;
  if(!skillKey){toast('請選擇技能',false);return}
  const prof=parseInt(document.getElementById('nsProf').value)||50;
  try{
    // Check duplicate
    const exists=npcSkills.find(n=>n.npc_key===npcKey&&n.skill_key===skillKey);
    if(exists){
      await apiPatch(`${SUPABASE_URL}/rest/v1/npc_skills?npc_key=eq.${npcKey}&skill_key=eq.${skillKey}`,{proficiency:prof});
    }else{
      await apiPost(`${SUPABASE_URL}/rest/v1/npc_skills`,{npc_key:npcKey,skill_key:skillKey,proficiency:prof});
    }
    npcSkills=await apiGet(`${SUPABASE_URL}/rest/v1/npc_skills?select=*&order=npc_key`);
    selectNsNpc(npcKey);renderNsNpcList(document.getElementById('nsSearch').value);renderWorldInfo();
    toast('✅ 已添加');
  }catch(e){toast('❌ '+e.message,false)}
}

async function removeNpcSkill(npcKey,skillKey){
  if(!confirm('確定移除？'))return;
  try{
    await apiDelete(`${SUPABASE_URL}/rest/v1/npc_skills?npc_key=eq.${npcKey}&skill_key=eq.${skillKey}`);
    npcSkills=await apiGet(`${SUPABASE_URL}/rest/v1/npc_skills?select=*&order=npc_key`);
    selectNsNpc(npcKey);renderNsNpcList(document.getElementById('nsSearch').value);renderWorldInfo();
    toast('✅ 已移除');
  }catch(e){toast('❌ '+e.message,false)}
}

// ===== Player Management =====
function renderPlayerList(filter=''){
  const el=document.getElementById('playerList');
  const f=filter.toLowerCase();
  const filtered=players.filter(p=>!f||p.name.toLowerCase().includes(f));
  if(!filtered.length){el.innerHTML='<div class="empty">冇玩家</div>';return}
  el.innerHTML=filtered.map(p=>{
    const active=selectedPlayer&&selectedPlayer.name===p.name;
    const save=p.save?JSON.parse(p.save):{};
    const xp=save.xp||0;
    const region=save.region||'?';
    return `<div class="list-item${active?' active':''}" onclick="selectPlayer('${esc(p.name)}')">
      <div class="name">${esc(p.name)}</div>
      <div class="meta">⚡${xp} · 📍${esc(region)}</div>
    </div>`;
  }).join('');
}
function filterPlayers(){renderPlayerList(document.getElementById('playerSearch').value)}

async function selectPlayer(name){
  selectedPlayer=players.find(p=>p.name===name)||null;
  renderPlayerList(document.getElementById('playerSearch').value);
  if(!selectedPlayer){document.getElementById('playerEditor').innerHTML='<div class="empty">← 選擇一個玩家</div>';return}
  // Fetch full player data
  try{
    const rows=await apiGet(`${SUPABASE_URL}/rest/v1/players?select=*&name=eq.${encodeURIComponent(name)}`);
    if(!rows.length){document.getElementById('playerEditor').innerHTML='<div class="empty">找不到玩家</div>';return}
    const p=rows[0];
    const save=p.save?JSON.parse(p.save):{};
    const playerSkills=await apiGet(`${SUPABASE_URL}/rest/v1/player_skills?select=*,skill_key&player_name=eq.${encodeURIComponent(name)}`);
    const aff=save.aff||{};
    const alignment=save.alignment||500;
    const alignLabel=alignment>=700?'正義':alignment>=550?'善':alignment>=450?'中立':alignment>=300?'惡':'邪惡';
    const region=save.region||'襄陽城';
    const xp=save.xp||0;
    const alignColor=alignment>=600?'var(--green)':alignment>=400?'var(--muted)':'var(--red)';

    let html=`<h3>${esc(p.name)}</h3>`;
    html+=`<div class="grid grid-2" style="margin-top:10px">`;
    html+=`<div><label>玩家名稱</label><input id="plName" value="${esc(p.name)}" readonly style="opacity:.6"></div>`;
    html+=`<div><label>所在區域</label><input id="plRegion" value="${esc(region)}"></div>`;
    html+=`</div>`;
    html+=`<div class="grid grid-2" style="margin-top:8px">`;
    html+=`<div><label>閱歷</label><input type="number" id="plXp" value="${xp}"></div>`;
    html+=`<div class="stat-bar"><label>善惡</label><input type="range" min="0" max="1000" value="${alignment}" id="plAlign" oninput="this.nextElementSibling.textContent=this.value"><span class="val" style="color:${alignColor}">${alignment} ${alignLabel}</span></div>`;
    html+=`</div>`;
    html+=`<div style="margin-top:10px"><label>已學技能 (${playerSkills.length})</label>`;
    if(playerSkills.length){
      html+=playerSkills.map(s=>{
        const sk=skills.find(x=>x.key===s.skill_key);
        const skName=sk?sk.name:s.skill_key;
        const skType=sk?sk.type:'';
        const eq=s.equipped?' ⚡裝備中':'';
        return `<div class="skill-row"><span class="tag ${TYPE_CSS[skType]||''}">${TYPE_LABEL[skType]||skType}</span><span class="sk-name">${esc(skName)}${eq}</span></div>`;
      }).join('');
    }else{html+=`<div style="font-size:12px;color:var(--muted);padding:6px 0">尚無技能</div>`}
    html+=`</div>`;
    // Affinity list
    const affKeys=Object.keys(aff);
    if(affKeys.length){
      html+=`<div style="margin-top:10px"><label>好感度</label>`;
      html+=affKeys.map(k=>{
        const npc=npcs.find(n=>n.key===k);
        const npcName=npc?npc.name:k;
        const v=aff[k];
        return `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px"><span style="width:60px;color:var(--muted)">${esc(npcName)}</span><div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="width:${v}%;height:100%;background:var(--gold);border-radius:2px"></div></div><span style="width:24px;text-align:right;color:var(--gold)">${v}</span></div>`;
      }).join('');
      html+=`</div>`;
    }
    html+=`<div class="btn-row" style="margin-top:14px">`;
    html+=`<button class="btn btn-primary" onclick="savePlayerData()">💾 保存</button>`;
    html+=`<button class="btn btn-danger" onclick="deletePlayerConfirm()">🗑 刪除玩家</button>`;
    html+=`</div>`;
    document.getElementById('playerEditor').innerHTML=html;
  }catch(e){document.getElementById('playerEditor').innerHTML=`<div class="empty">載入失敗: ${esc(e.message)}</div>`}
}

async function savePlayerData(){
  if(!selectedPlayer)return;
  const region=document.getElementById('plRegion').value.trim();
  const xp=parseInt(document.getElementById('plXp').value)||0;
  const alignment=parseInt(document.getElementById('plAlign').value)||500;
  try{
    const rows=await apiGet(`${SUPABASE_URL}/rest/v1/players?select=save&name=eq.${encodeURIComponent(selectedPlayer.name)}`);
    if(!rows.length){toast('找不到玩家',false);return}
    const save=rows[0].save?JSON.parse(rows[0].save):{};
    save.region=region;save.xp=xp;save.alignment=alignment;
    await apiPatch(`${SUPABASE_URL}/rest/v1/players?name=eq.${encodeURIComponent(selectedPlayer.name)}`,{save:JSON.stringify(save)});
    players=await apiGet(`${SUPABASE_URL}/rest/v1/players?select=name,created_at&order=created_at.desc`);
    renderPlayerList(document.getElementById('playerSearch').value);
    selectPlayer(selectedPlayer.name);
    renderWorldInfo();
    toast('✅ 玩家資料已保存');
  }catch(e){toast('❌ '+e.message,false)}
}

async function deletePlayerConfirm(){
  if(!selectedPlayer)return;
  if(!confirm(`確定刪除玩家「${selectedPlayer.name}」？此操作不可逆！`))return;
  try{
    await apiDelete(`${SUPABASE_URL}/rest/v1/players?name=eq.${encodeURIComponent(selectedPlayer.name)}`);
    await apiDelete(`${SUPABASE_URL}/rest/v1/player_skills?player_name=eq.${encodeURIComponent(selectedPlayer.name)}`);
    players=await apiGet(`${SUPABASE_URL}/rest/v1/players?select=name,created_at&order=created_at.desc`);
    selectedPlayer=null;
    document.getElementById('playerEditor').innerHTML='<div class="empty">← 選擇一個玩家</div>';
    renderPlayerList(document.getElementById('playerSearch').value);
    renderWorldInfo();
    toast('✅ 玩家已刪除');
  }catch(e){toast('❌ '+e.message,false)}
}

// ===== Init =====
loadAll();

</script>
